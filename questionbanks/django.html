<script>
(function(){

  const SECTIONS = DATA.sections;
  const APPENDIX = DATA.appendix;
  const ALL_QUESTIONS = [];
  SECTIONS.forEach(sec => sec.questions.forEach(q => {
    q._section = sec.num;
    q._sectionTitle = sec.title;
    ALL_QUESTIONS.push(q);
  }));
  const TOTAL = ALL_QUESTIONS.length;

  const STATUS_META = {
    new:      { label:'New',      short:'New',      color:'var(--text-faint)' },
    read:     { label:'Read',     short:'Read',     color:'var(--accent)' },
    revise:   { label:'Revise',   short:'Revise',   color:'var(--amber)' },
    mastered: { label:'Mastered', short:'Mastered', color:'var(--violet)' }
  };
  const TAG_META = {
    '🔥': { name:'High-frequency', color:'var(--hot)',  bg:'var(--hot-soft)'  },
    '⭐': { name:'Standard',       color:'var(--gold)', bg:'var(--gold-soft)' },
    '💡': { name:'Good-to-know',  color:'var(--teal)', bg:'var(--teal-soft)' }
  };

  let progress = {};          // { qid: { status, ts } }
  let filters = { section:'all', tag:'all', status:'all', q:'' };
  let saveTimer = null;
  let storageReady = false;
  let notes = {};   // { qid: "my remark text" }

  // ---------- storage ----------
   async function loadProgress(){
    try{
      const res = await window.storage.get('progress', false);
      if(res && res.value){ progress = JSON.parse(res.value); }
    }catch(e){ progress = {}; }
    try{
      const res = await window.storage.get('remarks', false);
      if(res && res.value){ notes = JSON.parse(res.value); }
    }catch(e){ notes = {}; }
    storageReady = true;
    renderAll();
  }

  function queueSave(){
    // Save immediately so leaving the iframe right after marking a question
    // cannot cancel its debounced write.
    (async ()=>{
      try{
        await window.storage.set('progress', JSON.stringify(progress), false);
      }catch(e){ /* the host app shows the sync error and keeps a local backup */ }
    })();
  }

    let notesSaveTimer = null;
  function queueSaveNotes(){
    if(notesSaveTimer) clearTimeout(notesSaveTimer);
    notesSaveTimer = setTimeout(flushNotes, 500);
  }
  async function flushNotes(){
    if(notesSaveTimer){ clearTimeout(notesSaveTimer); notesSaveTimer = null; }
    try{ await window.storage.set('remarks', JSON.stringify(notes), false); }catch(e){}
  }
  function setNote(qid, text){
    const v = (text || '').trim();
    if(v) notes[qid] = v; else delete notes[qid];
    queueSaveNotes();
  }
  function updateNoteFlag(qid){
    const head = document.querySelector(`.card-head[data-id="${qid}"]`);
    if(!head) return;
    const existing = head.querySelector('.note-flag');
    if(notes[qid] && !existing){
      const span = document.createElement('span');
      span.className = 'note-flag';
      span.title = 'You have remarks on this question';
      span.textContent = '📝';
      head.insertBefore(span, head.querySelector('.status-dot'));
    } else if(!notes[qid] && existing){
      existing.remove();
    }
  }

  function setStatus(qid, status){
    const cur = progress[qid];
    if(cur && cur.status === status){
      // toggle off back to 'new'
      progress[qid] = { status:'new', ts: Date.now() };
    } else {
      progress[qid] = { status: status, ts: Date.now() };
    }
    queueSave();
    renderAll();
    showToast(labelForToast(qid));
  }

  function labelForToast(qid){
    const st = getStatus(qid);
    const meta = STATUS_META[st];
    return `${qid} → marked as ${meta.label.toUpperCase()}`;
  }

  function getStatus(qid){
    return (progress[qid] && progress[qid].status) || 'new';
  }

  function resetAll(){
       if(!confirm(`Reset status for all ${TOTAL} questions? Your saved remarks will be kept. This cannot be undone.`)) return;
    progress = {};
    queueSave();
    renderAll();
    showToast('All progress reset');
  }

  // ---------- toast ----------
  let toastTimer=null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  // ---------- markdown render (lazy, cached) ----------
  const renderCache = {};
  function renderBody(q){
    if(renderCache[q.id]) return renderCache[q.id];
    const html = marked.parse(q.body || '');
    renderCache[q.id] = html;
    return html;
  }

  // ---------- filtering ----------
  function matches(q){
    const hay = (q.title + ' ' + q.body + ' ' + (notes[q.id] || '')).toLowerCase();
    if(filters.section !== 'all' && q._section !== filters.section) return false;
    if(filters.tag !== 'all' && q.tag !== filters.tag) return false;
    if(filters.status !== 'all' && getStatus(q.id) !== filters.status) return false;
    if(filters.q){
      const hay = (q.title + ' ' + q.body).toLowerCase();
      if(!hay.includes(filters.q.toLowerCase())) return false;
    }
    return true;
  }

  // ---------- render: sidebar tree ----------
  function sectionStats(secNum){
    const qs = secNum === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q._section === secNum);
    const done = qs.filter(q => ['read','mastered'].includes(getStatus(q.id))).length;
    return { done, total: qs.length };
  }

  function renderTree(){
    const tree = document.getElementById('tree');
    let html = '';
    const allStats = sectionStats('all');
    const allPct = allStats.total ? Math.round(100*allStats.done/allStats.total) : 0;
    html += `<div class="tree-item tree-all ${filters.section==='all'?'active':''}" data-section="all">
      <span class="tree-icon">🗂</span>
      <span class="tree-name">all_questions</span>
      <span class="tree-count">${allStats.done}/${allStats.total}</span>
    </div>`;
    SECTIONS.forEach(sec=>{
      const st = sectionStats(sec.num);
      const pct = st.total ? Math.round(100*st.done/st.total) : 0;
      const slug = sec.title.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
      html += `<div class="tree-item ${filters.section===sec.num?'active':''}" data-section="${sec.num}" title="${escapeAttr(sec.title)}">
        <span class="tree-icon">📄</span>
        <span class="tree-name">${sec.num.padStart(2,'0')}_${slug}.py</span>
        <span class="tree-count">${st.done}/${st.total}</span>
        <span class="tree-bar"><i style="width:${pct}%"></i></span>
      </div>`;
    });
    tree.innerHTML = html;
    tree.querySelectorAll('.tree-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        filters.section = el.getAttribute('data-section');
        closeSidebarMobile();
        renderAll();
      });
    });
  }

  function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

  // ---------- render: top stats + progress strip ----------
  function renderStats(){
    const counts = { new:0, read:0, revise:0, mastered:0 };
    ALL_QUESTIONS.forEach(q => counts[getStatus(q.id)]++);

    document.getElementById('topStats').innerHTML =
      `<span><b>${counts.read+counts.mastered}</b>/${TOTAL} reviewed</span>` +
      `<span style="color:var(--amber)">${counts.revise} to revise</span>`;

    const strip = document.getElementById('progressStrip');
    const order = ['mastered','read','revise','new'];
    const colors = { mastered:'var(--violet)', read:'var(--accent)', revise:'var(--amber)', new:'var(--border)' };
    strip.innerHTML = order.map(k=>{
      const w = TOTAL ? (counts[k]/TOTAL*100) : 0;
      return `<div class="seg" style="width:${w}%;background:${colors[k]}"></div>`;
    }).join('');

    document.getElementById('legend').innerHTML = `
      <span><i style="background:var(--violet)"></i>${counts.mastered} mastered</span>
      <span><i style="background:var(--accent)"></i>${counts.read} read</span>
      <span><i style="background:var(--amber)"></i>${counts.revise} revise</span>
      <span><i style="background:var(--border)"></i>${counts.new} new</span>
    `;
  }

  // ---------- render: chips ----------
  function renderChips(){
    const tagChips = document.getElementById('tagChips');
    const tags = [['all','All topics']].concat(Object.keys(TAG_META).map(t=>[t, TAG_META[t].name]));
    tagChips.innerHTML = tags.map(([val,label])=>{
      const active = filters.tag===val;
      const emoji = val==='all' ? '' : val+' ';
      return `<button class="chip ${active?'active':''}" data-tag="${val}">${emoji}${val==='all'?label:label}</button>`;
    }).join('');
    tagChips.querySelectorAll('.chip').forEach(el=>{
      el.addEventListener('click', ()=>{ filters.tag = el.getAttribute('data-tag'); renderAll(); });
    });

    const statusChips = document.getElementById('statusChips');
    const statuses = [['all','All status']].concat(Object.keys(STATUS_META).map(s=>[s, STATUS_META[s].label]));
    statusChips.innerHTML = statuses.map(([val,label])=>{
      const active = filters.status===val;
      const cls = val==='all' ? '' : ('st-'+val);
      return `<button class="chip ${active?'active '+cls:''}" data-status="${val}">${label}</button>`;
    }).join('');
    statusChips.querySelectorAll('.chip').forEach(el=>{
      el.addEventListener('click', ()=>{ filters.status = el.getAttribute('data-status'); renderAll(); });
    });
  }

  // ---------- render: results ----------
  let expandedSet = new Set();

  function renderResults(){
    const container = document.getElementById('results');
    const bySection = {};
    SECTIONS.forEach(sec=>{ bySection[sec.num] = sec.questions.filter(matches); });

    const activeSections = filters.section==='all' ? SECTIONS : SECTIONS.filter(s=>s.num===filters.section);
    let anyResults = false;
    let html = '';

    activeSections.forEach(sec=>{
      const qs = bySection[sec.num];
      if(!qs.length) return;
      anyResults = true;
      html += `<div class="section-heading"><span class="num">§${sec.num}</span><h2>${escapeHtml(sec.title)}</h2><span class="cnt">${qs.length} shown</span></div>`;
      if(sec.intro && filters.section!=='all'){
        html += `<div class="section-intro">${escapeHtml(sec.intro)}</div>`;
      }
      qs.forEach(q=>{
        html += cardHtml(q);
      });
    });

    if(!anyResults){
      html = `<div class="empty-state">
        <div class="glyph">$ grep -r "…" ./prep &rarr; 0 results</div>
        <div>No questions match your filters.</div>
        <button id="clearFiltersBtn">Clear filters</button>
      </div>`;
    }

    container.innerHTML = html;

    if(!anyResults){
      document.getElementById('clearFiltersBtn').addEventListener('click', ()=>{
        filters = { section:'all', tag:'all', status:'all', q:'' };
        document.getElementById('search').value='';
        renderAll();
      });
      return;
    }

    container.querySelectorAll('.card-head').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-id');
        if(expandedSet.has(id)) expandedSet.delete(id); else expandedSet.add(id);
        renderResults();
      });
    });
    container.querySelectorAll('.status-btn').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        setStatus(el.getAttribute('data-id'), el.getAttribute('data-status'));
      });
    });
        container.querySelectorAll('textarea[data-note]').forEach(el=>{
      const qid = el.getAttribute('data-note');
      el.addEventListener('click', e=>e.stopPropagation());
      el.addEventListener('input', ()=>setNote(qid, el.value));
      el.addEventListener('blur', ()=>{ setNote(qid, el.value); flushNotes(); updateNoteFlag(qid); });
    });
    container.querySelectorAll('[data-note-save]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const qid = el.getAttribute('data-note-save');
        const ta = container.querySelector(`textarea[data-note="${qid}"]`);
        setNote(qid, ta ? ta.value : '');
        await flushNotes();
        updateNoteFlag(qid);
        const badge = container.querySelector(`[data-saved="${qid}"]`);
        if(badge){ badge.classList.add('show'); setTimeout(()=>badge.classList.remove('show'), 1400); }
        showToast(`${qid} → remark saved`);
      });
    });
    container.querySelectorAll('[data-note-clear]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const qid = el.getAttribute('data-note-clear');
        const ta = container.querySelector(`textarea[data-note="${qid}"]`);
        if(!notes[qid] && !(ta && ta.value)) return;
        if(!confirm(`Clear your remark on ${qid}?`)) return;
        if(ta) ta.value = '';
        setNote(qid, '');
        await flushNotes();
        updateNoteFlag(qid);
        showToast(`${qid} → remark cleared`);
      });
    });
    container.querySelectorAll('.card-body').forEach(el=>{
      el.addEventListener('click', (e)=>e.stopPropagation());
    });

    // syntax highlight newly rendered code blocks
    container.querySelectorAll('pre code').forEach(block=>{
      hljs.highlightElement(block);
    });
  }

  function cardHtml(q){
    const status = getStatus(q.id);
    const expanded = expandedSet.has(q.id);
    const tagBadge = q.tag ? `<span class="tag-pill" title="${TAG_META[q.tag] ? TAG_META[q.tag].name : ''}">${q.tag}</span>` : '';
    let bodyBlock = '';
    if(expanded){
      const ts = progress[q.id] && progress[q.id].ts ? new Date(progress[q.id].ts).toLocaleString() : null;
      bodyBlock = `<div class="card-body">
        <div class="prose">${renderBody(q)}</div>
        <div class="actions-row">
          ${Object.keys(STATUS_META).map(s=>{
            const on = status===s ? 'on-'+s : '';
            return `<button class="status-btn ${on}" data-id="${q.id}" data-status="${s}"><i></i>${STATUS_META[s].label}</button>`;
          }).join('')}
          ${ts ? `<span class="log-line">[${ts}] status → ${status}</span>` : ''}
        </div>
        <div class="remarks">
          <div class="remarks-label">📝 my remarks <span class="saved" data-saved="${q.id}">saved</span></div>
          <textarea data-note="${q.id}" placeholder="Your own explanation, a gotcha you hit at work, how you'd say this out loud…">${escapeHtml(notes[q.id] || '')}</textarea>
          <div class="remarks-actions">
            <button class="remarks-btn" data-note-save="${q.id}">Save remark</button>
            <button class="remarks-btn ghost" data-note-clear="${q.id}">Clear</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="card ${expanded?'expanded':''}">
      <div class="card-head" data-id="${q.id}">
        <span class="qid">${q.id}</span>
        ${tagBadge}
        <span class="card-title">${escapeHtml(q.title)}</span>
                ${notes[q.id] ? '<span class="note-flag" title="You have remarks on this question">📝</span>' : ''}
        <span class="status-dot ${status!=='new'?status:''}"></span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      ${bodyBlock}
    </div>`;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  // ---------- jump to next unread ----------
  function jumpToNext(){
    const pool = ALL_QUESTIONS.filter(matches);
    let target = pool.find(q => getStatus(q.id)==='new');
    if(!target) target = pool.find(q => getStatus(q.id)==='revise');
    if(!target){
      showToast('Nothing left to review in this view 🎉');
      return;
    }
    expandedSet = new Set([target.id]);
    renderResults();
    setTimeout(()=>{
      const el = document.querySelector(`.card-head[data-id="${target.id}"]`);
      if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 30);
  }

  // ---------- appendix modal ----------
  function openAppendix(){
    document.getElementById('appendixContent').innerHTML = marked.parse(APPENDIX || '');
    document.getElementById('appendixModal').classList.add('open');
  }
  function closeAppendix(){
    document.getElementById('appendixModal').classList.remove('open');
  }

  // ---------- mobile sidebar ----------
  function openSidebarMobile(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  }
  function closeSidebarMobile(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
  }

  // ---------- wire up static controls ----------
  document.getElementById('menuBtn').addEventListener('click', openSidebarMobile);
  document.getElementById('scrim').addEventListener('click', closeSidebarMobile);
  document.getElementById('appendixBtn').addEventListener('click', openAppendix);
  document.getElementById('appendixBtn2').addEventListener('click', openAppendix);
  document.getElementById('closeModal').addEventListener('click', closeAppendix);
  document.getElementById('appendixModal').addEventListener('click', (e)=>{
    if(e.target.id==='appendixModal') closeAppendix();
  });
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  document.getElementById('nextBtn').addEventListener('click', jumpToNext);

  let searchDebounce=null;
  document.getElementById('search').addEventListener('input', (e)=>{
    const val = e.target.value;
    if(searchDebounce) clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{
      filters.q = val;
      renderResults();
    }, 120);
  });

  // ---------- master render ----------
  function renderAll(){
    renderTree();
    renderStats();
    renderChips();
    renderResults();
  }

  renderAll();
  loadProgress();

})();
</script>
</body>
</html>
