<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Django Interview Prep — 1–2 YOE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg:#0a0f0c;
    --bg-alt:#0d1411;
    --surface:#121a16;
    --surface-2:#17201b;
    --surface-hover:#1b2620;
    --border:#213028;
    --border-soft:#182420;
    --text:#e8f1ec;
    --text-dim:#93ac9f;
    --text-faint:#5d7268;
    --accent:#44b78b;
    --accent-dim:#2f8768;
    --accent-deep:#0c4b33;
    --accent-soft:rgba(68,183,139,0.13);
    --amber:#e0a53f;
    --amber-soft:rgba(224,165,63,0.13);
    --violet:#a68cfa;
    --violet-soft:rgba(166,140,250,0.13);
    --hot:#e35d4f;
    --hot-soft:rgba(227,93,79,0.13);
    --gold:#d4a72c;
    --gold-soft:rgba(212,167,44,0.13);
    --teal:#3fb8af;
    --teal-soft:rgba(63,184,175,0.13);
    --radius:10px;
    --radius-sm:6px;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
    --sidebar-w:268px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(68,183,139,0.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft); color:var(--text);}
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:16px;
    padding:14px 20px;
    background:rgba(10,15,12,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex; align-items:baseline; gap:10px; min-width:0;}
  .brand .path{font-family:var(--mono); color:var(--text-faint); font-size:13px; white-space:nowrap;}
  .brand h1{
    font-size:16.5px; font-weight:700; margin:0; letter-spacing:-0.01em; white-space:nowrap;
  }
  .brand .cursor{
    display:inline-block; width:8px; height:16px; background:var(--accent);
    margin-left:2px; vertical-align:-3px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{opacity:0;} }
  .topbar-spacer{flex:1;}
  .topbar-stats{
    display:flex; gap:14px; font-family:var(--mono); font-size:12px; color:var(--text-dim);
    white-space:nowrap;
  }
  .topbar-stats b{color:var(--text); font-weight:600;}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-dim); cursor:pointer; flex:none;
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-hover); color:var(--text); border-color:var(--accent-dim);}
  .menu-btn{display:none;}

  /* ---------- Layout ---------- */
  .layout{display:flex; align-items:flex-start;}
  .sidebar{
    width:var(--sidebar-w); flex:none;
    position:sticky; top:63px;
    height:calc(100vh - 63px);
    overflow-y:auto;
    border-right:1px solid var(--border-soft);
    padding:16px 12px 40px;
  }
  .sidebar-label{
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.08em; padding:4px 8px 10px;
  }
  .tree-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 8px; border-radius:8px; cursor:pointer;
    font-family:var(--mono); font-size:12.5px; color:var(--text-dim);
    margin-bottom:2px; border:1px solid transparent;
    position:relative;
  }
  .tree-item:hover{background:var(--surface);}
  .tree-item.active{background:var(--surface-2); border-color:var(--border); color:var(--text);}
  .tree-item.active::before{
    content:''; position:absolute; left:-13px; top:8px; bottom:8px; width:2px; background:var(--accent);
  }
  .tree-icon{opacity:0.7; flex:none; font-size:13px;}
  .tree-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tree-count{font-size:10.5px; color:var(--text-faint); flex:none;}
  .tree-bar{
    position:absolute; left:8px; right:8px; bottom:3px; height:2px;
    background:var(--border); border-radius:2px; overflow:hidden;
  }
  .tree-bar > i{display:block; height:100%; background:var(--accent); border-radius:2px;}
  .tree-all{margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--border-soft);}

  .sidebar-appendix-btn{
    margin-top:14px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:9px 10px; border-radius:8px; cursor:pointer; font-size:12px; font-family:var(--mono);
  }
  .sidebar-appendix-btn:hover{color:var(--text); border-color:var(--accent-dim);}

  .sidebar-reset{
    margin-top:8px; width:100%; text-align:left;
    background:transparent; border:1px dashed var(--border); color:var(--text-faint);
    padding:9px 10px; border-radius:8px; cursor:pointer; font-size:11.5px; font-family:var(--mono);
  }
  .sidebar-reset:hover{color:var(--hot); border-color:var(--hot);}

  .main{flex:1; min-width:0; padding:22px 24px 80px;}
  .content-wrap{max-width:880px; margin:0 auto;}

  /* progress strip */
  .progress-strip{
    display:flex; gap:3px; height:8px; border-radius:6px; overflow:hidden;
    background:var(--surface-2); margin-bottom:18px; border:1px solid var(--border-soft);
  }
  .progress-strip .seg{height:100%;}
  .legend{
    display:flex; flex-wrap:wrap; gap:14px; margin:-10px 0 20px; font-size:11.5px; color:var(--text-dim); font-family:var(--mono);
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  /* ---------- filter bar ---------- */
  .filterbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:18px;
  }
  .search-wrap{position:relative; flex:1 1 220px; min-width:180px;}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.5; pointer-events:none;}
  #search{
    width:100%; padding:9px 12px 9px 34px; border-radius:8px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-size:13.5px; font-family:var(--sans);
  }
  #search::placeholder{color:var(--text-faint);}
  #search:focus{border-color:var(--accent-dim);}

  .chipgroup{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    padding:7px 12px; border-radius:100px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:12px; cursor:pointer;
    white-space:nowrap; font-family:var(--mono); display:flex; align-items:center; gap:5px;
    transition:all .12s;
  }
  .chip:hover{border-color:var(--accent-dim); color:var(--text);}
  .chip.active{background:var(--accent-soft); border-color:var(--accent-dim); color:var(--text);}
  .chip.active.st-new{background:var(--surface-2); border-color:var(--text-faint); color:var(--text);}
  .chip.active.st-read{background:var(--accent-soft); border-color:var(--accent-dim); color:var(--accent);}
  .chip.active.st-revise{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
  .chip.active.st-mastered{background:var(--violet-soft); border-color:var(--violet); color:var(--violet);}

  .next-btn{
    margin-left:auto; padding:8px 14px; border-radius:8px; border:1px solid var(--accent-dim);
    background:var(--accent-soft); color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:var(--mono); white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  .next-btn:hover{background:var(--accent-dim); color:#08120e;}

  .section-heading{
    display:flex; align-items:baseline; gap:10px; margin:30px 0 12px;
    padding-bottom:8px; border-bottom:1px solid var(--border-soft);
  }
  .section-heading:first-child{margin-top:0;}
  .section-heading .num{font-family:var(--mono); color:var(--accent); font-size:13px;}
  .section-heading h2{font-size:15.5px; margin:0; font-weight:700; color:var(--text);}
  .section-heading .cnt{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
  .section-intro{font-size:13px; color:var(--text-dim); margin:-6px 0 14px; line-height:1.6;}

  /* ---------- Card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    margin-bottom:10px; overflow:hidden;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--border);}
  .card.expanded{border-color:var(--accent-dim);}
  .card-head{
    display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; user-select:none;
  }
  .qid{
    font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--text-faint);
    background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:2px 7px;
    flex:none;
  }
  .tag-pill{font-size:12px; flex:none;}
  .card-title{flex:1; min-width:0; font-size:13.5px; line-height:1.45; font-weight:500; color:var(--text);}
  .status-dot{
    width:9px; height:9px; border-radius:50%; flex:none; background:var(--text-faint);
    box-shadow:0 0 0 3px transparent;
  }
  .status-dot.read{background:var(--accent);}
  .status-dot.revise{background:var(--amber);}
  .status-dot.mastered{background:var(--violet);}
  .chevron{flex:none; color:var(--text-faint); transition:transform .18s;}
  .card.expanded .chevron{transform:rotate(90deg); color:var(--accent);}

  .card-body{
    padding:0 16px 16px; border-top:1px solid var(--border-soft);
  }
  .prose{font-size:13.8px; line-height:1.75; color:var(--text); padding-top:14px;}
  .prose p{margin:0 0 12px;}
  .prose strong{color:var(--text); font-weight:700;}
  .prose em{color:var(--text-dim);}
  .prose code{
    font-family:var(--mono); background:var(--surface-2); padding:2px 6px; border-radius:4px;
    font-size:0.88em; color:var(--accent);
  }
  .prose pre{
    background:#0d1a15; border:1px solid var(--border-soft); border-radius:8px;
    padding:12px 14px; overflow-x:auto; margin:10px 0 14px;
  }
  .prose pre code{background:none; padding:0; color:inherit; font-size:12.6px; line-height:1.6;}
  .prose ul, .prose ol{margin:0 0 12px; padding-left:22px;}
  .prose li{margin-bottom:5px;}
  .prose hr{border:none; border-top:1px dashed var(--border-soft); margin:14px 0;}

  .actions-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:6px; padding-top:14px;
    border-top:1px solid var(--border-soft);
  }
  .status-btn{
    padding:7px 12px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-dim); font-size:12px; font-family:var(--mono); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .status-btn:hover{border-color:var(--accent-dim); color:var(--text);}
  .status-btn.on-new{background:var(--surface-2); border-color:var(--text-faint); color:var(--text);}
  .status-btn.on-read{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .status-btn.on-revise{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
  .status-btn.on-mastered{background:var(--violet-soft); border-color:var(--violet); color:var(--violet);}
  .status-btn i{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block;}
  .log-line{
    margin-left:auto; font-family:var(--mono); font-size:10.8px; color:var(--text-faint); white-space:nowrap;
  }

    /* ---------- Remarks ---------- */
  .remarks{margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);}
  .remarks-label{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;
  }
  .remarks-label .saved{
    margin-left:auto; text-transform:none; letter-spacing:0; color:var(--accent);
    opacity:0; transition:opacity .2s;
  }
  .remarks-label .saved.show{opacity:1;}
  .remarks textarea{
    width:100%; min-height:88px; resize:vertical;
    background:var(--bg-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:var(--mono); font-size:12.6px; line-height:1.65;
    padding:10px 12px;
  }
  .remarks textarea::placeholder{color:var(--text-faint);}
  .remarks textarea:focus{border-color:var(--accent-dim); outline:none;}
  .remarks-actions{display:flex; gap:8px; margin-top:8px;}
  .remarks-btn{
    padding:6px 12px; border-radius:7px; font-family:var(--mono); font-size:11.5px;
    background:var(--accent-soft); border:1px solid var(--accent-dim); color:var(--accent); cursor:pointer;
  }
  .remarks-btn:hover{background:var(--accent-dim); color:#08120e;}
  .remarks-btn.ghost{background:transparent; border:1px dashed var(--border); color:var(--text-faint);}
  .remarks-btn.ghost:hover{color:var(--hot); border-color:var(--hot); background:transparent;}
  .note-flag{flex:none; font-size:11px; opacity:0.85;}

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--text-dim);
  }
  .empty-state .glyph{font-family:var(--mono); font-size:26px; color:var(--text-faint); margin-bottom:10px;}
  .empty-state button{
    margin-top:14px; padding:8px 16px; border-radius:8px; border:1px solid var(--accent-dim);
    background:var(--accent-soft); color:var(--accent); cursor:pointer; font-size:12.5px; font-family:var(--mono);
  }

  /* Appendix modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,7,5,0.72); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:100; padding:60px 20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-alt); border:1px solid var(--border); border-radius:12px;
    max-width:640px; width:100%; max-height:78vh; overflow-y:auto; padding:22px 24px;
  }
  .modal h2{margin-top:0; font-size:15px; font-family:var(--mono); color:var(--accent);}
  .modal .prose{padding-top:4px;}
  .modal-close{
    float:right; background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    width:28px; height:28px; border-radius:7px; cursor:pointer;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    padding:9px 16px; border-radius:8px; font-size:12px; font-family:var(--mono);
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* mobile */
  @media (max-width: 820px){
    .sidebar{
      position:fixed; left:0; top:57px; bottom:0; z-index:40; background:var(--bg);
      transform:translateX(-100%); transition:transform .2s; width:82vw; max-width:300px;
      box-shadow:20px 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex;}
    .main{padding:16px 14px 70px;}
    .brand .path{display:none;}
    .topbar-stats{display:none;}
    .next-btn{margin-left:0; width:100%; justify-content:center;}
    .search-wrap{flex-basis:100%;}
    .sidebar-scrim{
      position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:39; display:none;
    }
    .sidebar-scrim.open{display:block;}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle sections">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand">
    <span class="path">prep/</span>
    <h1>django_interview_qs<span class="cursor"></span></h1>
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-stats" id="topStats"></div>
  <button class="icon-btn" id="appendixBtn" title="About the tags &amp; final tips" aria-label="About">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
  </button>
</div>

<div class="layout">
  <div class="sidebar-scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Sections</div>
    <div id="tree"></div>
    <button class="sidebar-appendix-btn" id="appendixBtn2">📖 About the tags &amp; tips</button>
    <button class="sidebar-reset" id="resetBtn">⟲ reset all progress</button>
  </aside>

  <main class="main">
    <div class="content-wrap">
      <div class="progress-strip" id="progressStrip"></div>
      <div class="legend" id="legend"></div>

      <div class="filterbar">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" type="text" placeholder="Search questions… (e.g. N+1, select_related, CSRF)" />
        </div>
        <div class="chipgroup" id="tagChips"></div>
        <div class="chipgroup" id="statusChips"></div>
        <button class="next-btn" id="nextBtn">→ Jump to next unread</button>
      </div>

      <div id="results"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="appendixModal">
  <div class="modal">
    <button class="modal-close" id="closeModal">✕</button>
    <h2># about_these_tags.md</h2>
    <div class="prose" id="appendixContent"></div>
  </div>
</div>

const DATA = {"sections": [{"num": "1", "title": "Django Basics & Architecture", "intro": "", "questions": [{"id": "Q1", "tag": "", "title": "What is Django and why is it called a \"batteries-included\" framework?", "body": "Django is a high-level Python web framework that follows the MVT (Model-View-Template) pattern. It's \"batteries-included\" because it ships with an ORM, admin panel, authentication, forms, templating, caching, and security features out of the box — you don't need third-party packages for basic web app needs.\n*Follow-up: How is MVT different from MVC?*\nIn MVC, the controller handles request logic. In Django's MVT, Django itself acts as the controller — it maps URLs to views automatically. The **View** contains business logic (like a controller), the **Template** is the presentation layer (like the view in MVC), and the **Model** stays the same."}, {"id": "Q2", "tag": "", "title": "Explain the request-response lifecycle in Django.", "body": "Request hits the WSGI/ASGI server → Django's `WSGIHandler`/middleware stack processes it → URL resolver (`urls.py`) matches the path to a view → the view runs business logic, often touching models → it returns an `HttpResponse` (often rendered from a template) → the response passes back through middleware → sent to the client.\n*Follow-up: Where exactly do middlewares run in this cycle?*\nEach middleware wraps the next one like an onion. Request-side code in each middleware runs top-to-bottom before hitting the view; response-side code runs bottom-to-top after the view returns."}, {"id": "Q3", "tag": "", "title": "What is `settings.py` used for, and how do you manage different settings for dev/staging/prod?", "body": "It holds all project configuration — installed apps, middleware, database config, static/media paths, secret key, etc. For multiple environments, common practice is splitting into `base.py`, `dev.py`, `prod.py` (importing from base) or using environment variables via `django-environ`/`python-decouple`, and setting `DJANGO_SETTINGS_MODULE` accordingly.\n*Follow-up: Why shouldn't `SECRET_KEY` be hardcoded in settings.py?*\nIt's used for cryptographic signing (sessions, CSRF tokens, password reset tokens). If leaked in version control, attackers could forge sessions or tokens. It should be loaded from an environment variable or secrets manager."}, {"id": "Q4", "tag": "", "title": "What's the difference between a Django \"project\" and an \"app\"?", "body": "A project is the overall configuration (settings, root URLconf) for a website; it can contain multiple apps. An app is a self-contained module handling a specific feature (e.g., `blog`, `users`) and is meant to be reusable.\n*Follow-up: Can one app be used across multiple projects?*\nYes, if it's decoupled properly — no hardcoded references to other apps, own `urls.py`, and pip-installable. Django itself is designed with this reusability principle (django-allauth, django-rest-framework are good examples)."}, {"id": "Q5", "tag": "", "title": "What is `manage.py` and name a few commands you use often.", "body": "It's a command-line utility for administrative tasks tied to the project settings. Common commands: `runserver`, `makemigrations`, `migrate`, `createsuperuser`, `shell`, `dbshell`, `collectstatic`, `test`.\n*Follow-up: How is `manage.py` different from `django-admin`?*\n`django-admin` is the generic Django command-line tool; `manage.py` is a thin wrapper around it that automatically points to your project's settings module."}, {"id": "Q6", "tag": "", "title": "What is WSGI vs ASGI, and when do you need ASGI?", "body": "WSGI (Web Server Gateway Interface) is the standard synchronous interface between Python web apps and servers — handles one request per thread/worker. ASGI is the async successor, supporting WebSockets, long-lived connections, and async views. You need ASGI when using Django Channels, async views, or WebSocket features.\n*Follow-up: Can a Django app run both sync and async views?*\nYes, since Django 3.1+ you can define `async def` views, and Django auto-detects and runs them properly, though full end-to-end async (ORM included) support has matured more in Django 4.1+ with `async` ORM methods like `.aget()`."}, {"id": "Q7", "tag": "", "title": "What is the Django Admin, and how do you customize it?", "body": "It's an auto-generated CRUD interface based on your models. Customize via `ModelAdmin` classes — `list_display`, `search_fields`, `list_filter`, `readonly_fields`, inline models, overriding `save_model()`, or custom admin actions.\n*Follow-up: How would you add a custom bulk action in admin?*\nDefine a function taking `(self, request, queryset)`, add it to the `ModelAdmin.actions` list, and it appears in the admin's action dropdown for selected rows."}, {"id": "Q8", "tag": "", "title": "What is `INSTALLED_APPS` and what happens if you forget to add your app there?", "body": "It's the list of app configs Django loads at startup — it drives model registration, migrations, admin, template/static discovery, and signal loading. If you forget to add an app, its models won't be recognized (no migrations generated, admin registration fails) and its signals/templates won't load.\n*Follow-up: What is `AppConfig` used for?*\nIt's a per-app configuration class (in `apps.py`) that lets you customize app metadata and hook into `ready()` — commonly used to connect signals at startup."}]}, {"num": "2", "title": "Models & Django ORM", "intro": "", "questions": [{"id": "Q9", "tag": "🔥", "title": "What is the Django ORM and what problem does it solve?", "body": "It lets you interact with the database using Python classes/objects instead of raw SQL, abstracting the underlying database engine (Postgres, MySQL, SQLite) and providing a QuerySet API for building queries lazily.\n*Follow-up: Is the ORM always the right choice? When would you write raw SQL?*\nFor complex reporting queries, heavy aggregations, or when you need database-specific optimizations (window functions, CTEs) not well supported by the ORM, raw SQL (`.raw()` or `connection.cursor()`) can be faster and clearer.\n**Use case:** On an e-commerce site, instead of hand-writing `SELECT * FROM products WHERE category_id = 5`, you write `Product.objects.filter(category_id=5)`. Same result, but it works unchanged whether the DB is Postgres or SQLite, and it's automatically protected from SQL injection."}, {"id": "Q10", "tag": "", "title": "What's the difference between `Model.objects.filter()` and `Model.objects.get()`?", "body": "`filter()` returns a QuerySet (can be empty, one, or many rows) and is lazy. `get()` returns exactly one object or raises `DoesNotExist`/`MultipleObjectsReturned` if zero or more than one match.\n*Follow-up: Why is `get()` risky in production code without try/except?*\nAn unhandled `DoesNotExist` exception will cause a 500 error (or crash a script) if the row doesn't exist. It's safer to use `filter().first()` or wrap `get()` in try/except, or use `get_object_or_404()` in views."}, {"id": "Q11", "tag": "", "title": "Explain lazy evaluation of QuerySets.", "body": "A QuerySet doesn't hit the database until it's actually evaluated — e.g., when iterated, sliced with a step, converted to a list, or when `len()`/`repr()`/`bool()` is called on it. This allows chaining `.filter().exclude().order_by()` without multiple DB hits.\n*Follow-up: Name a case where slicing a QuerySet still doesn't evaluate it.*\nRegular slicing (e.g., `qs[0:5]`) translates to `LIMIT`/`OFFSET` in SQL and stays lazy — it only executes when you actually iterate/access the sliced result."}, {"id": "Q12", "tag": "🔥", "title": "What is the N+1 query problem, and how do you solve it in Django?", "body": "It happens when you fetch a list of objects, then access a related object/field on each in a loop, triggering one extra query per row. Solved using `select_related()` (for ForeignKey/OneToOne, does a SQL JOIN) and `prefetch_related()` (for ManyToMany/reverse FK, does a separate query + Python-side join).\n*Follow-up: When would `select_related` NOT help?*\nFor reverse ForeignKey or ManyToMany relationships, since those return multiple rows per parent — a JOIN would duplicate the parent row. That's exactly what `prefetch_related` is designed for instead.\n**Use case:** A blog listing page shows 50 posts, and each one displays its author's name. Without fixing this, that's 1 query for the posts plus 50 more — one per author. This exact pattern (list page + related field in a loop) is where N+1 hides in almost every real app: order lists, comment sections, product catalogs."}, {"id": "Q13", "tag": "🔥", "title": "Difference between `select_related` and `prefetch_related`?", "body": "`select_related` performs a SQL JOIN in a single query — used for `ForeignKey`/`OneToOneField` (single related object). `prefetch_related` performs separate queries per relation and joins the results in Python — used for `ManyToManyField` and reverse FK relations (multiple related objects).\n*Follow-up: Can you use `Prefetch()` objects for more control?*\nYes — `Prefetch('related_set', queryset=Model.objects.filter(...))` lets you filter/annotate/order the prefetched queryset instead of fetching everything.\n**Use case:** An order confirmation page needs the order's customer (a single related object → FK → use `select_related`) and all its line items (many related rows → reverse FK → use `prefetch_related`). Using the wrong one either duplicates rows (JOIN on a one-to-many) or triggers extra queries (no JOIN on a one-to-one)."}, {"id": "Q14", "tag": "", "title": "What are `annotate()` and `aggregate()`?", "body": "In plain terms: `aggregate()` gives you **one summary number for the whole list** (like a total). `annotate()` gives you **one extra number attached to each item** in the list (like a per-item count). Technically: `aggregate()` computes a single summary value across the whole QuerySet (e.g., total count, average) and returns a dict; `annotate()` adds a computed value **per row** to each item in the QuerySet.\n*Follow-up: How would you get, per author, the count of books they wrote?*\n`Author.objects.annotate(book_count=Count('book'))` — each Author object then has a `.book_count` attribute."}, {"id": "Q15", "tag": "", "title": "What is `Q` object and when do you use it?", "body": "In plain terms: normal keyword filtering like `.filter(status='active', is_admin=True)` always means AND — there's no built-in way to say OR. `Q` objects fix that. They let you build complex queries with `OR`, `AND`, `NOT` logic, e.g. `Model.objects.filter(Q(status='active') | Q(is_admin=True))`.\n*Follow-up: How do you negate a condition using Q?*\n`~Q(status='active')` — the `~` operator does a logical NOT."}, {"id": "Q16", "tag": "", "title": "What is `F()` expression used for?", "body": "It references a model field's value directly in a database query, allowing field-to-field comparisons or atomic updates without pulling data into Python first — e.g., `Model.objects.update(views=F('views') + 1)`.\n*Follow-up: Why is this safer than incrementing in Python (`obj.views += 1; obj.save()`)?*\n`F()` does the increment inside the database itself, avoiding race conditions where two concurrent requests read the same value and overwrite each other (a lost update)."}, {"id": "Q17", "tag": "⭐", "title": "What's the difference between `save()` and `update()`?", "body": "`save()` operates on a single model instance and runs the full save pipeline (including signals like `pre_save`/`post_save`, and validation if called). `update()` is a QuerySet method that does a bulk `UPDATE` SQL statement directly on the DB for potentially many rows — it **bypasses** `save()`, model validation, and signals.\n*Follow-up: So if I need signals to fire during a bulk update, what do I do?*\nLoop through objects and call `.save()` on each (slower, N queries), or use `bulk_update()` with custom signal handling, or manually trigger signals if truly needed. There's a tradeoff between performance and correctness here.\n**Use case:** Marking *one* order as shipped → use `.save()`, because you also want an email-notification signal to fire. Marking 10,000 old orders as archived overnight in a cleanup script → use `.update()`, since you don't need per-row signals and want it done in one fast SQL statement instead of 10,000 round trips."}, {"id": "Q18", "tag": "🔥", "title": "What are Django migrations, and how do they work internally?", "body": "Migrations are version-controlled Python files describing schema changes (create table, add column, etc.), generated from model changes via `makemigrations` and applied via `migrate`. Django tracks applied migrations in the `django_migrations` table.\n*Follow-up: What happens if two developers create conflicting migrations on separate branches?*\nYou get a migration conflict (multiple leaf nodes for an app). Resolve with `makemigrations --merge`, which creates a merge migration depending on both leaf nodes.\n**Use case:** You need to add a `phone_number` column to your `User` model in an app that's already live in production, without hand-writing `ALTER TABLE` SQL and without risking breaking existing rows — migrations generate and apply that schema change safely, and can be rolled back if something goes wrong."}, {"id": "Q19", "tag": "", "title": "What is `related_name` in a ForeignKey field?", "body": "In plain terms: if `Book` has a ForeignKey to `Author`, Django lets you go \"forward\" easily (`book.author`), but going \"backward\" — from an author to all their books — needs a name too. By default Django calls it `author.book_set`, which reads awkwardly. `related_name` lets you rename that reverse accessor to something natural, e.g., `author.books`, by setting `related_name='books'` on the FK.\n*Follow-up: What happens if you have two FKs from the same model to the same target model and don't set `related_name`?*\nDjango raises a system check error for a clashing reverse accessor — you must define distinct `related_name` values for each."}, {"id": "Q20", "tag": "⭐", "title": "Explain `on_delete` options for ForeignKey.", "body": "- `CASCADE`: deletes related objects too.\n- `PROTECT`: prevents deletion if related objects exist (raises `ProtectedError`).\n- `SET_NULL`: sets FK to null (requires `null=True`).\n- `SET_DEFAULT`: sets FK to a default value.\n- `DO_NOTHING`: does nothing at the Django level (dangerous — can break DB integrity if not handled at DB level).\n*Follow-up: Which would you choose for an `order.customer` FK and why?*\nUsually `PROTECT` or `SET_NULL` — you generally don't want deleting a customer to silently cascade-delete their order history; you'd rather block it or preserve orders with a null customer reference.\n**Use case:** Beyond the customer example above: a `Comment.post` FK pointing to `Post` would usually use `CASCADE` (deleting a post should delete its comments too) — showing that the *right* choice depends entirely on the relationship's real-world meaning, which is exactly what interviewers are probing for with this question."}, {"id": "Q21", "tag": "", "title": "What is `null=True` vs `blank=True`?", "body": "In plain terms: these solve two different problems that sound similar. `null=True` is about the **database** — it decides whether the actual column is allowed to store `NULL`. `blank=True` is about **forms/validation** — it decides whether a form (or the admin) will accept the field being left empty. They're independent settings; for CharFields, convention is to use `blank=True` only (avoid `null=True` on strings to prevent having both `''` and `NULL` as \"empty\").\n*Follow-up: Why avoid `null=True` on CharField/TextField?*\nIt creates two different representations of \"no value\" (`NULL` and empty string `''`), which complicates queries and validation logic."}, {"id": "Q22", "tag": "", "title": "What are Meta options in a Django model? Name a few.", "body": "The `class Meta` inside a model configures model-level behavior: `ordering`, `unique_together`/`constraints`, `db_table`, `verbose_name`, `indexes`, `abstract`.\n*Follow-up: What's the difference between `unique_together` and `UniqueConstraint`?*\n`unique_together` is the older, simpler API. `UniqueConstraint` (in `constraints`) is more powerful — supports conditional uniqueness (`condition=`), custom names, and expressions, and is the recommended modern approach."}, {"id": "Q23", "tag": "", "title": "What is an abstract base model vs multi-table inheritance in Django?", "body": "An **abstract model** (`abstract = True` in Meta) defines shared fields/methods but creates no DB table of its own — each child gets its own table with those fields. **Multi-table inheritance** creates a separate table per model, linked via an implicit OneToOne, requiring a JOIN to fetch parent fields.\n*Follow-up: Which is generally preferred for performance and why?*\nAbstract base classes, usually — they avoid the JOIN overhead of multi-table inheritance since each child table has all fields directly."}, {"id": "Q24", "tag": "", "title": "What is a `Proxy model`?", "body": "A model that doesn't create a new table but changes Python-level behavior (custom methods, different `Meta.ordering`, different manager) for the same underlying data — set via `Meta.proxy = True`.\n*Follow-up: Give a real use case.*\nE.g., a `Person` model and a `Alumni(Person)` proxy model with a different default `ordering` or a custom manager filtering `graduated=True`, without duplicating the table."}, {"id": "Q25", "tag": "", "title": "What are custom Model Managers, and why use them?", "body": "A Manager is the interface (`Model.objects`) through which QuerySets are created. Custom managers let you encapsulate common filtering logic — e.g., `Post.objects.published()` instead of repeating `Post.objects.filter(status='published')` everywhere.\n*Follow-up: How do you add a second manager without losing the default `objects` manager?*\nDefine your custom manager as an additional attribute (e.g., `published = PublishedManager()`) — but note that the **first** manager defined becomes Django's default; if you want to keep `objects` as default, define it explicitly too."}, {"id": "Q26", "tag": "", "title": "What's the difference between `bulk_create()` and looping with `.save()`?", "body": "`bulk_create()` inserts many objects in a single (or few) SQL `INSERT` statements — much faster for large datasets. It **skips** `save()`, so no signals fire, no auto-`pk` is set back on SQLite for older versions, and `M2M` fields can't be set at creation time.\n*Follow-up: What's a gotcha with `bulk_create` and primary keys on Postgres vs older SQLite?*\nOn Postgres/modern SQLite, `bulk_create` will populate the `pk` on the objects after insert. On some databases/older SQLite, PKs won't be set back on the Python objects, so don't rely on that if the target DB doesn't support it."}, {"id": "Q27", "tag": "🔥", "title": "How do database transactions work in Django?", "body": "By default, each individual query auto-commits unless you're within a transaction block. `transaction.atomic()` (as decorator or context manager) wraps a block of code so that either all queries succeed or all are rolled back on an exception.\n*Follow-up: What is `select_for_update()` used for?*\nIt locks selected rows until the end of the transaction, preventing race conditions in concurrent read-modify-write scenarios (e.g., decrementing stock count).\n**Use case:** Transferring money between two bank accounts — debit account A and credit account B must both succeed or both fail. Wrapped in `transaction.atomic()`, a crash or error halfway through rolls back the whole thing instead of leaving A debited with B never credited."}, {"id": "Q28", "tag": "", "title": "What is `values()` vs `values_list()`?", "body": "`values()` returns a QuerySet of dictionaries with field names as keys. `values_list()` returns tuples (or a flat list with `flat=True`), which is slightly more memory-efficient when you only need specific field values.\n*Follow-up: Why use these instead of full model instances?*\nThey avoid the overhead of instantiating full model objects when you only need raw field data — useful for exports, dropdown choices, or feeding into serializers/analytics."}]}, {"num": "3", "title": "Views, URLs & Templates", "intro": "", "questions": [{"id": "Q29", "tag": "", "title": "Difference between Function-Based Views (FBV) and Class-Based Views (CBV)?", "body": "FBVs are plain Python functions taking a request and returning a response — simple, explicit control flow. CBVs use classes (often subclassing generic views like `ListView`, `DetailView`) offering reusability via inheritance/mixins, but with more \"magic\"/implicit behavior.\n*Follow-up: When would you prefer FBV over CBV?*\nFor simple, one-off views with unique logic that doesn't map well to CRUD patterns — FBVs are often easier to read and debug than untangling a CBV's MRO (method resolution order) across mixins."}, {"id": "Q30", "tag": "", "title": "What are Django generic views? Name a few.", "body": "Pre-built CBVs for common patterns: `ListView`, `DetailView`, `CreateView`, `UpdateView`, `DeleteView`, `TemplateView`, `RedirectView`, `FormView`.\n*Follow-up: How do you restrict a `ListView` to only logged-in users?*\nAdd `LoginRequiredMixin` before the generic view class in the inheritance list, e.g., `class MyListView(LoginRequiredMixin, ListView):`."}, {"id": "Q31", "tag": "", "title": "What is `get_context_data()` used for in CBVs?", "body": "It's overridden to add extra context variables to be passed to the template, in addition to what the base view already provides. You must call `super().get_context_data(**kwargs)` first and update the returned dict.\n*Follow-up: What's a common mistake when overriding it?*\nForgetting to call `super()` — which drops the default context the parent view already builds (like the object list in `ListView`)."}, {"id": "Q32", "tag": "", "title": "Explain Django's URL routing and `path()` vs `re_path()`.", "body": "`urls.py` maps URL patterns to views. `path()` uses simple converters (`<int:pk>`, `<slug:slug>`, `<str:name>`) for common cases. `re_path()` supports full regex for more complex patterns.\n*Follow-up: How do you namespace URLs across apps?*\nSet `app_name` in the app's `urls.py` and use `{% url 'app_name:view_name' %}` in templates or `reverse('app_name:view_name')` in code."}, {"id": "Q33", "tag": "", "title": "What is `reverse()` and why use it instead of hardcoding URLs?", "body": "`reverse()` dynamically builds a URL from a view name/URL pattern name, so if the URL path changes in `urls.py`, you don't need to update every hardcoded string reference across the codebase.\n*Follow-up: What's the template-tag equivalent?*\n`{% url 'view_name' arg1 arg2 %}` in templates."}, {"id": "Q34", "tag": "", "title": "What are Django template tags/filters? Give examples.", "body": "Tags control logic (`{% if %}`, `{% for %}`, `{% block %}`, `{% include %}`), filters transform displayed values (`{{ value|lower }}`, `{{ date|date:\"Y-m-d\" }}`, `{{ list|length }}`).\n*Follow-up: How do you write a custom template filter?*\nCreate a `templatetags` package in your app, register a function with `@register.filter`, load it in a template with `{% load your_tags %}`."}, {"id": "Q35", "tag": "", "title": "What is template inheritance and `{% block %}`?", "body": "A base template (`base.html`) defines the overall structure with named `{% block content %}` sections. Child templates `{% extends \"base.html\" %}` and override specific blocks, promoting DRY layout code.\n*Follow-up: Can you have multiple blocks with the same name?*\nNo — block names must be unique within a template, though a child can call `{{ block.super }}` to include the parent block's content plus its own additions."}, {"id": "Q36", "tag": "🔥", "title": "What is CSRF and how does Django handle it in forms?", "body": "Cross-Site Request Forgery is an attack tricking a logged-in user's browser into submitting unwanted requests. Django's `CsrfViewMiddleware` requires a valid, per-session CSRF token on unsafe HTTP methods (POST, PUT, DELETE). In templates, you add `{% csrf_token %}` inside forms.\n*Follow-up: How is CSRF handled differently for AJAX/API requests?*\nYou must manually attach the CSRF token to request headers (`X-CSRFToken`) read from the `csrftoken` cookie, or use `@csrf_exempt` for stateless token-based APIs (like DRF with token/JWT auth, which don't rely on session cookies).\n**Use case:** You're logged into your bank in one browser tab. A malicious site open in another tab tries to silently auto-submit a hidden \"transfer $500\" form to your bank, riding on your active login session. CSRF protection blocks that hidden cross-site submission because it can't produce a valid token."}, {"id": "Q37", "tag": "", "title": "What is `get_object_or_404()` and `render()`?", "body": "`get_object_or_404()` fetches an object or raises `Http404` automatically instead of `DoesNotExist`. `render()` is a shortcut combining template loading, context rendering, and returning an `HttpResponse`.\n*Follow-up: What does `render()` do under the hood?*\nIt calls `loader.get_template(template_name).render(context, request)` and wraps the result in an `HttpResponse`."}, {"id": "Q38", "tag": "", "title": "What are Django Forms and ModelForms? Difference?", "body": "`Form` is a plain form class you define fields for manually and handle saving yourself. `ModelForm` auto-generates form fields from a model, and its `.save()` method can directly create/update model instances.\n*Follow-up: How do you add custom validation to a ModelForm field?*\nOverride `clean_<fieldname>()` for single-field validation, or `clean()` for cross-field validation, raising `forms.ValidationError` when invalid."}, {"id": "Q39", "tag": "", "title": "What is `request.GET` vs `request.POST`?", "body": "`request.GET` is a QueryDict of URL query parameters (e.g., `?page=2`). `request.POST` is a QueryDict of form data submitted via POST (not query params). Both are immutable QueryDicts by default.\n*Follow-up: How do you access uploaded files in a request?*\nVia `request.FILES`, which is populated when the form uses `enctype=\"multipart/form-data\"`."}, {"id": "Q40", "tag": "", "title": "What is middleware in Django? Name a few built-in ones.", "body": "Middleware is a lightweight plugin that processes requests/responses globally before they reach views or after views return. Built-ins: `SecurityMiddleware`, `SessionMiddleware`, `CsrfViewMiddleware`, `AuthenticationMiddleware`, `CommonMiddleware`.\n*Follow-up: How do you write a custom middleware?*\nDefine a callable class with `__init__(self, get_response)` and `__call__(self, request)` — call `self.get_response(request)` to pass control down the chain, and add its dotted path to `MIDDLEWARE` in settings."}]}, {"num": "4", "title": "Authentication, Sessions & Permissions", "intro": "", "questions": [{"id": "Q41", "tag": "⭐", "title": "How does Django's authentication system work by default?", "body": "`django.contrib.auth` provides a `User` model, `authenticate()` (validates credentials against configured backends), and `login()` (attaches the user to the session). `AuthenticationMiddleware` attaches `request.user` on every request based on the session.\n*Follow-up: How would you use a custom user model instead of the default?*\nSet `AUTH_USER_MODEL = 'myapp.CustomUser'` in settings **before the first migration**, subclassing `AbstractUser` (keeps default fields) or `AbstractBaseUser` (fully custom).\n**Use case:** A login form checks the submitted username/password with `authenticate()`; if valid, `login()` attaches that user to the session, so every future request from that browser is recognized as \"this user\" without re-typing credentials on every page."}, {"id": "Q42", "tag": "🔥", "title": "What's the difference between `AbstractUser` and `AbstractBaseUser`?", "body": "`AbstractUser` extends Django's default `User` fields/behavior — you just add extra fields. `AbstractBaseUser` gives you a blank slate (just password/last_login handling) — you must define all fields and a custom manager yourself.\n*Follow-up: When would you need `AbstractBaseUser` instead of `AbstractUser`?*\nWhen you want to completely remove the `username` field and use `email` as the unique identifier, or need a drastically different user schema.\n**Use case:** Most apps just need small tweaks — e.g., logging in with email instead of username, or adding a `company_name` field — so they extend `AbstractUser`. A full rebuild with `AbstractBaseUser` is for edge cases like a multi-tenant SaaS product needing a completely non-standard user schema from scratch."}, {"id": "Q43", "tag": "⭐", "title": "How does Django store passwords?", "body": "Passwords are never stored in plaintext — they're hashed using a configurable hasher (default: PBKDF2 with SHA256, salted), stored as `algorithm$iterations$salt$hash`. Compared via `check_password()`, not direct string comparison.\n*Follow-up: How would you upgrade all users to a stronger hasher (e.g., Argon2)?*\nAdd the new hasher to the top of `PASSWORD_HASHERS`; Django auto-upgrades a user's hash to the new algorithm the next time they successfully log in (lazy migration), no bulk rehash of unknown passwords needed (since you can't reverse a hash).\n**Use case:** Even if your database gets leaked or stolen, an attacker still can't directly read anyone's password — they'd have to brute-force crack the hash, and algorithms like PBKDF2/Argon2 are deliberately slow to make that computationally expensive at scale."}, {"id": "Q44", "tag": "", "title": "Explain Django sessions — where is session data stored?", "body": "On login, Django creates a session, stores a `sessionid` cookie in the browser, and keeps the actual session data server-side (default backend: database, via `django_session` table; also supports cache, file, or signed cookies).\n*Follow-up: What's the tradeoff of using the cache-based session backend vs DB-based?*\nCache-based is much faster (no DB round trip) but data may be lost if the cache is cleared/restarted (unless persistent); DB-based is durable but adds a DB query per session access."}, {"id": "Q45", "tag": "", "title": "What is `@login_required` decorator, and how does `LoginRequiredMixin` differ for CBVs?", "body": "`@login_required` wraps a function-based view, redirecting unauthenticated users to `LOGIN_URL`. `LoginRequiredMixin` does the same for class-based views by overriding `dispatch()` — it must be listed as the leftmost/first base class.\n*Follow-up: How do you handle permission-based (not just login) access control?*\n`@permission_required('app.permission_codename')` for FBVs, or `PermissionRequiredMixin` for CBVs; both check `request.user.has_perm()`."}, {"id": "Q46", "tag": "", "title": "What are Django's default permissions on models?", "body": "Django auto-creates four permissions per model: `add_<model>`, `change_<model>`, `delete_<model>`, `view_<model>`.\n*Follow-up: How do you add a custom permission?*\nAdd to `Meta.permissions = [('can_publish', 'Can publish posts')]` on the model, then run `makemigrations`/`migrate`."}, {"id": "Q47", "tag": "", "title": "What is `Group` in Django auth, and why use it?", "body": "A `Group` is a named collection of permissions that can be assigned to multiple users at once — useful for role-based access (e.g., \"Editors\", \"Moderators\") instead of assigning permissions individually to every user.\n*Follow-up: How do you check if a user belongs to a group?*\n`request.user.groups.filter(name='Editors').exists()`."}]}, {"num": "5", "title": "Django REST Framework (DRF)", "intro": "", "questions": [{"id": "Q48", "tag": "🔥", "title": "What is a Serializer in DRF, and why is it needed?", "body": "It converts complex data (querysets/model instances) into native Python datatypes that can be rendered into JSON/XML, and also handles deserialization + validation of incoming data back into Python objects.\n*Follow-up: Difference between `Serializer` and `ModelSerializer`?*\n`ModelSerializer` auto-generates fields from a model (like `ModelForm` does for forms) and provides default `create()`/`update()` implementations, reducing boilerplate compared to plain `Serializer`.\n**Use case:** A mobile app calls your API for book details — the serializer is the translator that turns your Python `Book` model into the JSON the app can actually parse, and turns incoming JSON from the app back into a validated Python object on write."}, {"id": "Q49", "tag": "🔥", "title": "What are DRF Generic Views vs ViewSets?", "body": "Generic Views (`ListAPIView`, `RetrieveUpdateDestroyAPIView`, etc.) map to individual URL patterns like regular views. `ViewSet`/`ModelViewSet` bundles multiple related actions (list, retrieve, create, update, delete) into one class, typically wired via a `Router`, generating URLs automatically.\n*Follow-up: What is a `Router` in DRF?*\n`DefaultRouter`/`SimpleRouter` auto-generates URL patterns for a ViewSet's standard actions (list/detail/create/update/delete), avoiding manual `urls.py` entries for each.\n**Use case:** Building a full CRUD API for `Book` (list, retrieve, create, update, delete) — a `ModelViewSet` plus a router gives you all 5 of those endpoints wired up in about 5 lines, instead of writing and manually routing 5 separate view classes."}, {"id": "Q50", "tag": "⭐", "title": "What is a DRF Permission class? Name built-ins.", "body": "It controls whether a request is authorized to access a view — checked before the view logic runs. Built-ins: `IsAuthenticated`, `IsAdminUser`, `AllowAny`, `IsAuthenticatedOrReadOnly`.\n*Follow-up: How do you write a custom object-level permission?*\nSubclass `BasePermission` and override `has_object_permission(self, request, view, obj)`, e.g., checking `obj.owner == request.user`.\n**Use case:** A blog API where anyone (even logged-out visitors) can read posts (`AllowAny`), but only logged-in users can create a new one (`IsAuthenticated`) — permission classes are literally the on/off switch controlling that."}, {"id": "Q51", "tag": "⭐", "title": "Difference between Authentication and Permission in DRF?", "body": "Authentication identifies **who** the user is (e.g., via Token, JWT, Session). Permission decides **what** that identified (or anonymous) user is allowed to do. Authentication runs first, then permission checks use `request.user`.\n*Follow-up: Name common DRF authentication classes.*\n`SessionAuthentication`, `TokenAuthentication`, and third-party JWT auth (`SimpleJWT`'s `JWTAuthentication`).\n**Use case:** Authentication answers \"is this a valid token, and whose token is it?\" Permission then answers a separate question: \"is *this specific* user allowed to delete *this particular* post?\" (e.g., only the post's original author, checked via object-level permission)."}, {"id": "Q52", "tag": "", "title": "How does pagination work in DRF?", "body": "Configured globally (`DEFAULT_PAGINATION_CLASS` in settings) or per-view. Common classes: `PageNumberPagination` (`?page=2`), `LimitOffsetPagination` (`?limit=10&offset=20`), `CursorPagination` (opaque cursor, best for large/real-time-changing datasets to avoid skipped/duplicated rows).\n*Follow-up: Why prefer cursor pagination for a frequently-updated feed?*\nOffset-based pagination can skip or duplicate items if rows are inserted/deleted between page requests; cursor pagination anchors to a stable position, avoiding that issue."}, {"id": "Q53", "tag": "🔥", "title": "What is throttling in DRF?", "body": "Rate-limiting mechanism to control how many requests a user/IP can make in a time window, preventing abuse — configured via `DEFAULT_THROTTLE_CLASSES`/`DEFAULT_THROTTLE_RATES`, e.g., `UserRateThrottle`, `AnonRateThrottle`.\n*Follow-up: Where is throttle state typically stored?*\nIn Django's cache framework (so a fast cache backend like Redis/Memcached is recommended in production for accuracy across multiple workers).\n**Use case:** A public search API is getting hammered by a script sending thousands of requests a minute, degrading service for everyone else. Throttling caps it — e.g., 100 requests/hour per user — so one bad actor can't take down the API for legitimate users."}, {"id": "Q54", "tag": "", "title": "How do you handle nested serializers (e.g., an Order with multiple Items)?", "body": "Declare the child serializer as a field on the parent, e.g., `items = ItemSerializer(many=True)`. For **writable** nested serializers, you must override `create()`/`update()` in the parent serializer to manually handle creating/updating the nested objects since DRF doesn't do this automatically by default.\n*Follow-up: Why doesn't DRF support writable nested serializers out of the box?*\nBecause the \"correct\" way to create/update nested relations (e.g., handle partial updates, deletions, uniqueness) is app-specific and ambiguous — DRF intentionally leaves it to the developer to avoid making wrong assumptions."}, {"id": "Q55", "tag": "", "title": "What is `to_representation()` and `to_internal_value()`?", "body": "`to_representation()` controls how a Python object is converted to output data (serialization). `to_internal_value()` controls how incoming raw data is validated/converted into Python native types (deserialization). Override them for custom field-level transformation logic.\n*Follow-up: When would you override `to_representation()` on a serializer?*\nTo reshape output — e.g., flattening a nested object, adding a computed field, or conditionally hiding fields based on the requesting user's role."}, {"id": "Q56", "tag": "", "title": "What are DRF's `SerializerMethodField` used for?", "body": "A read-only field computed by calling a method on the serializer (`get_<field_name>(self, obj)`) — useful for derived/computed values not directly stored on the model.\n*Follow-up: Can `SerializerMethodField` be used for writes?*\nNo, it's read-only by design; for writable custom logic you'd handle it in `create()`/`update()` instead."}]}, {"num": "6", "title": "Signals, Celery & Async Tasks", "intro": "", "questions": [{"id": "Q57", "tag": "🔥", "title": "What are Django signals? Give an example use case.", "body": "Signals let decoupled parts of an app get notified when certain actions occur — e.g., `post_save`, `pre_delete`, `m2m_changed`. Example: automatically creating a `Profile` object whenever a `User` is created, via `post_save` on `User`.\n*Follow-up: What's a downside of overusing signals?*\nThey make code flow implicit/hidden — debugging becomes harder since the \"trigger\" and \"effect\" are in separate files with no direct call visible in the main code path. Overuse can also cause performance issues or unexpected cascading side effects.\n**Use case:** When a new `User` signs up, you also want a linked `Profile` object created automatically (for avatar, bio, etc.) — a signal lets you do that without cluttering the signup view with unrelated setup logic."}, {"id": "Q58", "tag": "", "title": "What is the difference between `pre_save` and `post_save`?", "body": "`pre_save` fires before the object is written to the DB (useful for modifying fields before saving). `post_save` fires after the save completes (useful for creating related objects, sending notifications) — includes a `created` boolean to distinguish insert vs update.\n*Follow-up: How do you avoid infinite recursion when saving inside a `post_save` signal for the same model?*\nUse `update_fields` carefully, disconnect the signal temporarily, or use a flag/condition, or better — do the logic without re-triggering `save()` on the same instance (e.g., use `.update()` on a QuerySet instead where signals aren't needed)."}, {"id": "Q59", "tag": "🔥", "title": "Why use Celery with Django, and what problem does it solve?", "body": "Celery is a distributed task queue used to run time-consuming or non-critical work (sending emails, generating reports, image processing) **asynchronously**, outside the request-response cycle, so users aren't stuck waiting on a slow HTTP response.\n*Follow-up: What's the role of a message broker (e.g., Redis/RabbitMQ) in this setup?*\nThe broker queues tasks published by Django and delivers them to available Celery workers; it decouples task producers from consumers and enables scaling workers independently.\n**Use case:** A user clicks \"place order.\" You don't want them staring at a loading spinner while a receipt email sends in the background — the order saves and the response returns immediately, while Celery sends the email asynchronously a moment later."}, {"id": "Q60", "tag": "", "title": "What is a Celery \"task\", and how do you define one?", "body": "A task is a Python function decorated with `@shared_task` (or `@app.task`) that Celery can execute asynchronously. Called via `.delay()` (shortcut) or `.apply_async()` (more control — countdown, retries, queue routing).\n*Follow-up: How do you retry a failed Celery task?*\nSet `bind=True` on the task, catch the exception, and call `self.retry(exc=e, countdown=..., max_retries=...)`, or configure `autoretry_for` on the task decorator."}, {"id": "Q61", "tag": "", "title": "What is Celery Beat?", "body": "A scheduler that triggers periodic tasks (like a cron job) at defined intervals, configured via `CELERY_BEAT_SCHEDULE` in settings or the `django-celery-beat` package for DB-backed dynamic schedules.\n*Follow-up: How would you schedule a task to run every day at midnight?*\nUsing `crontab(hour=0, minute=0)` from `celery.schedules` in the beat schedule config."}]}, {"num": "7", "title": "Caching & Performance", "intro": "", "questions": [{"id": "Q62", "tag": "⭐", "title": "What caching backends does Django support?", "body": "Local-memory cache (dev only, per-process), file-based cache, database cache, and — most common in production — Memcached or Redis (via `django-redis`).\n*Follow-up: Why avoid local-memory cache in a multi-process production deployment?*\nEach worker process has its own separate memory cache, so cached data isn't shared across processes — leads to inconsistent cache state and wasted memory duplicating the same cached values per worker.\n**Use case:** A homepage shows \"top 10 trending products,\" recalculated from a fairly expensive query. Recomputing that from scratch for every single visitor is wasteful since it doesn't need to be second-by-second fresh — caching it for a few minutes cuts DB load dramatically with no visible difference to users."}, {"id": "Q63", "tag": "", "title": "What is the difference between per-view caching and template fragment caching?", "body": "Per-view caching (`@cache_page`) caches the entire rendered response for a URL. Template fragment caching (`{% cache %}` tag) caches only a specific portion of a template, useful when most of a page is static but small parts (like a user's name) need to stay dynamic.\n*Follow-up: How do you cache a QuerySet result manually?*\nUse the low-level cache API: `cache.set('key', queryset_result, timeout)` and `cache.get('key')`, generating a cache key based on relevant parameters and invalidating it (`cache.delete()`) when underlying data changes."}, {"id": "Q64", "tag": "🔥", "title": "How would you identify and fix a slow Django view in production?", "body": "Use Django Debug Toolbar (dev) or APM tools (New Relic, Sentry performance, Datadog) in staging/prod to profile query counts and time. Common fixes: add `select_related`/`prefetch_related`, add DB indexes, cache expensive computations, paginate large result sets, move heavy work to Celery.\n*Follow-up: How do you check the exact SQL queries a view is running?*\n`django.db.connection.queries` (with `DEBUG=True`), Django Debug Toolbar's SQL panel, or logging with `django.db.backends` logger set to DEBUG level.\n**Use case:** A dashboard page takes 8 seconds to load. Django Debug Toolbar reveals it's silently running 200+ SQL queries because of an N+1 problem buried in a template loop — the tool tells you exactly what to fix instead of guessing."}, {"id": "Q65", "tag": "", "title": "What is database indexing, and how do you add an index in Django?", "body": "An index speeds up lookups/filters/sorts on a column at the cost of slightly slower writes and extra storage. Add via `db_index=True` on a field, or more flexibly via `Meta.indexes = [models.Index(fields=['field1', 'field2'])]` for composite/multi-column indexes.\n*Follow-up: When would adding an index NOT help, or even hurt?*\nOn low-cardinality columns (e.g., a boolean with only two values) indexes give little benefit; on tables with very heavy write volume, extra indexes slow down inserts/updates since each index must also be updated."}]}, {"num": "8", "title": "Testing", "intro": "", "questions": [{"id": "Q66", "tag": "", "title": "What testing tools does Django provide out of the box?", "body": "`django.test.TestCase` (wraps each test in a transaction that's rolled back after), `Client` for simulating HTTP requests, `override_settings` decorator, and fixtures/factory data helpers. Built on Python's `unittest`.\n*Follow-up: What's the difference between `TestCase` and `TransactionTestCase`?*\n`TestCase` wraps tests in a DB transaction rolled back after each test (fast, but can't test transaction-related behavior itself). `TransactionTestCase` truncates tables between tests instead — slower, but needed when testing things like `on_commit()` callbacks or actual transaction behavior."}, {"id": "Q67", "tag": "", "title": "How do you test a DRF API endpoint?", "body": "Use `rest_framework.test.APIClient` (or APITestCase) to send requests (`self.client.get/post(...)`, then assert on `response.status_code` and `response.json()`/`response.data`.\n*Follow-up: How do you test an endpoint that requires authentication?*\n`self.client.force_authenticate(user=some_user)` (bypasses actual login for test simplicity) or log in via `self.client.login(username=..., password=...)` for session auth."}, {"id": "Q68", "tag": "", "title": "What is mocking, and when would you use it in Django tests?", "body": "Mocking replaces real dependencies (external API calls, email sending, time-based logic) with fake objects so tests are fast, deterministic, and don't depend on external services. Commonly done via `unittest.mock.patch`.\n*Follow-up: Give an example of what you'd mock when testing a view that sends an email.*\nMock `django.core.mail.send_mail` (or the specific function/service used) so the test doesn't actually send a real email, and assert it was called with expected arguments."}, {"id": "Q69", "tag": "", "title": "What are fixtures in Django testing?", "body": "Pre-defined data (usually JSON/YAML) loaded into the test database before tests run, via `fixtures = ['data.json']` in a TestCase, or `loaddata` command.\n*Follow-up: Why do many teams prefer factory libraries (e.g., `factory_boy`) over fixtures?*\nFixtures are static and can drift out of sync with schema changes (fields renamed/added break silently). Factories generate objects programmatically using current model definitions, are more flexible (randomized/overridable data), and fail loudly if the model changes."}]}, {"num": "9", "title": "Security", "intro": "", "questions": [{"id": "Q70", "tag": "🔥", "title": "What common security features does Django provide by default?", "body": "CSRF protection, XSS protection via auto-escaping in templates, SQL injection protection via parameterized ORM queries, clickjacking protection (`X-Frame-Options` via `XFrameOptionsMiddleware`), and secure password hashing.\n*Follow-up: Does Django's auto-escaping protect you if you use `{% autoescape off %}` or `|safe`?*\nNo — both explicitly disable escaping, so any user-controlled content rendered that way is vulnerable to XSS if not manually sanitized.\n**Use case:** Out of the box, a fresh Django project already blocks several classic beginner mistakes (SQL injection, reflected XSS, clickjacking) without you writing any extra code — which is exactly why \"what does Django give you for free\" is such a common interview opener."}, {"id": "Q71", "tag": "⭐", "title": "How does Django prevent SQL injection?", "body": "The ORM uses parameterized queries under the hood — user input is never directly concatenated into SQL strings. Risk reappears if you use `.raw()` or `cursor.execute()` with string formatting instead of passing parameters separately.\n*Follow-up: Show the safe way to use raw SQL with a user-supplied parameter.*\n`cursor.execute(\"SELECT * FROM app_model WHERE id = %s\", [user_input])` — passing parameters as a separate list lets the DB driver escape them safely, instead of an f-string/`%` formatted directly into the query string.\n**Use case:** A login form where someone types `' OR '1'='1` into the username box, hoping a hand-written SQL query gets tricked into returning every user in the table. The ORM's parameterized queries treat that string purely as *data*, never as executable SQL, so the trick simply doesn't work."}, {"id": "Q72", "tag": "🔥", "title": "What is Cross-Site Scripting (XSS) and how does Django's template engine mitigate it?", "body": "XSS lets an attacker inject malicious scripts into pages viewed by other users. Django's template engine auto-escapes variables (`<`, `>`, `&`, quotes) by default when rendering `{{ variable }}`, so injected HTML/JS renders as harmless text instead of executing.\n*Follow-up: If you must render trusted HTML content, how do you do it safely?*\nUse `mark_safe()` or `|safe` only on content you fully control/sanitize (e.g., via a library like `bleach` to strip dangerous tags), never on raw untrusted user input.\n**Use case:** A comment section where someone posts `<script>alert('hacked')<\/script>` as their comment text. Django auto-escapes it into harmless visible text (`&lt;script&gt;...`) in the rendered page instead of letting the browser actually execute it against other visitors."}, {"id": "Q73", "tag": "⭐", "title": "What is Clickjacking, and how does Django defend against it?", "body": "Clickjacking tricks a user into clicking something on your site by embedding it in an invisible iframe on an attacker's page. Django's `XFrameOptionsMiddleware` sets the `X-Frame-Options: DENY/SAMEORIGIN` header by default to block that.\n*Follow-up: How would you allow a specific page to be framed?*\nUse the `@xframe_options_exempt` decorator on that specific view, or set `X_FRAME_OPTIONS = 'SAMEORIGIN'` if you need to allow framing from the same origin only.\n**Use case:** A malicious site embeds your app's \"Delete Account\" page inside an invisible iframe, positioned under a fake \"Claim your prize\" button — tricking a logged-in user into clicking \"delete\" without realizing it. `X-Frame-Options` blocks your pages from being framed like that in the first place."}, {"id": "Q74", "tag": "", "title": "What are Django's HTTPS/SSL related security settings?", "body": "`SECURE_SSL_REDIRECT` (forces HTTPS), `SESSION_COOKIE_SECURE`/`CSRF_COOKIE_SECURE` (cookies only sent over HTTPS), `SECURE_HSTS_SECONDS` (enforces HSTS), `SECURE_PROXY_SSL_HEADER` (needed behind a reverse proxy to correctly detect HTTPS).\n*Follow-up: Why is `SECURE_PROXY_SSL_HEADER` needed in production behind Nginx/load balancers?*\nBecause the actual TLS termination happens at the proxy, and Django (running behind it over plain HTTP internally) needs to trust a specific header (e.g., `X-Forwarded-Proto`) set by the proxy to know the original request was HTTPS."}]}, {"num": "10", "title": "Deployment & Miscellaneous", "intro": "", "questions": [{"id": "Q75", "tag": "", "title": "What is `collectstatic` and why is it needed in production?", "body": "It gathers static files from all apps and `STATICFILES_DIRS` into a single directory (`STATIC_ROOT`) so a production web server (Nginx) or CDN can serve them directly, since Django itself doesn't efficiently serve static files in production.\n*Follow-up: What does `django.contrib.staticfiles` do in development vs why it's disabled in prod?*\nIn dev, Django's dev server serves static files automatically (via `runserver`) for convenience. In prod, `DEBUG=False` disables this because it's inefficient/insecure at scale — a real web server or CDN should handle static assets instead."}, {"id": "Q76", "tag": "", "title": "How do environment variables help in Django config management?", "body": "They keep sensitive/environment-specific values (DB credentials, secret key, API keys, debug flag) out of source code, letting the same codebase run differently across dev/staging/prod without code changes — typically read via `os.environ` or libraries like `django-environ`.\n*Follow-up: Why is this more secure than a settings file with hardcoded values checked into git?*\nAnyone with repo access (or a leaked repo) would otherwise see production secrets; environment variables are injected at deploy time and stay outside version control."}, {"id": "Q77", "tag": "", "title": "What's the role of Gunicorn/uWSGI with Django in production?", "body": "Django's built-in `runserver` is single-threaded and not production-grade. Gunicorn/uWSGI are WSGI application servers that run multiple worker processes to handle concurrent requests efficiently, usually placed behind Nginx as a reverse proxy for static files/SSL termination/load balancing.\n*Follow-up: Why put Nginx in front of Gunicorn instead of exposing Gunicorn directly?*\nNginx efficiently serves static files, handles SSL termination, buffers slow clients, and load-balances across multiple Gunicorn workers/instances — tasks Gunicorn isn't optimized for."}, {"id": "Q78", "tag": "", "title": "How do you handle environment-specific database configs (e.g., Postgres in prod, SQLite in dev)?", "body": "Define `DATABASES` dynamically based on an environment variable (e.g., `DATABASE_URL`, parsed via `dj_database_url`), so switching environments only requires changing env vars, not code.\n*Follow-up: Why might using SQLite in dev but Postgres in prod cause bugs?*\nSubtle SQL dialect/behavior differences (e.g., case-sensitivity, JSON field support, certain constraints) can behave differently, so bugs that don't appear locally may surface only in production — many teams now recommend running Postgres locally (e.g. via Docker) too."}, {"id": "Q79", "tag": "", "title": "What is `django-debug-toolbar` and when should it NOT be enabled?", "body": "A debugging panel showing SQL queries, request/response info, template rendering, cache calls, etc., for local development. It should never be enabled in production — it exposes internal app details/performance data and adds overhead, and is a potential info-leak/security risk.\n*Follow-up: How do you make sure it's only loaded in dev?*\nGuard its inclusion in `INSTALLED_APPS`/`MIDDLEWARE` with `if DEBUG:` checks in settings."}, {"id": "Q80", "tag": "⭐", "title": "What is the difference between `DEBUG=True` and `DEBUG=False` in terms of security?", "body": "With `DEBUG=True`, unhandled exceptions show a full traceback with source code, local variables, and settings values — a serious info leak if exposed publicly. `DEBUG=False` shows a generic error page instead and requires `ALLOWED_HOSTS` to be properly set.\n*Follow-up: What happens if you deploy with `DEBUG=True` by mistake?*\nAnyone triggering an error can see sensitive internal information (potentially secret keys, DB credentials in settings, stack traces revealing code structure) — a well-known and commonly exploited misconfiguration."}]}, {"num": "11", "title": "Rapid-Fire Conceptual Questions (Often Asked as Warm-ups)", "intro": "", "questions": [{"id": "Q81", "tag": "", "title": "What is idempotency, and which HTTP methods are idempotent?", "body": "An idempotent operation produces the same result no matter how many times it's repeated. `GET`, `PUT`, `DELETE` are idempotent; `POST` is not (each call can create a new resource).\n*Follow-up: Is `PATCH` idempotent?*\nNot necessarily — it depends on the semantics of the update; a `PATCH` that says \"increment by 1\" is not idempotent, while one that says \"set field to X\" is."}, {"id": "Q82", "tag": "", "title": "What's the difference between `HttpResponse`, `JsonResponse`, and `HttpResponseRedirect`?", "body": "`HttpResponse` returns raw content with a content type you specify. `JsonResponse` is a subclass that auto-serializes a dict to JSON and sets the content type. `HttpResponseRedirect` (or `redirect()`) sends a 3xx response to redirect the browser to another URL.\n*Follow-up: What status code does `redirect()` return by default, and how do you make it permanent?*\n302 (temporary) by default; pass `permanent=True` for a 301."}, {"id": "Q83", "tag": "", "title": "What is `context_processors` in Django?", "body": "Functions that inject additional variables into the context of every template render automatically, without needing to pass them explicitly in each view — e.g., the built-in `request`, `auth` (adds `user`), `messages` context processors.\n*Follow-up: How would you make a \"site settings\" object available on every page?*\nWrite a custom context processor function returning `{'site_settings': ...}` and add its dotted path to `TEMPLATES[0]['OPTIONS']['context_processors']`."}, {"id": "Q84", "tag": "", "title": "What is the Django `messages` framework used for?", "body": "A way to store one-time notification messages (success/error/info) for the user across requests (using session or cookie storage), typically displayed once and then cleared — e.g., \"Profile updated successfully.\"\n*Follow-up: How do you display messages in a template?*\nIterate `{% for message in messages %}` (enabled by the `messages` context processor), often styling by `message.tags` (e.g., `success`, `error`)."}, {"id": "Q85", "tag": "", "title": "What's the difference between `redirect()` and rendering a template directly after a form POST?", "body": "Best practice (Post/Redirect/Get pattern) is to redirect after a successful POST to avoid duplicate form submissions if the user refreshes the page; rendering a template directly after POST would resubmit the same data on refresh.\n*Follow-up: What HTTP status is typically used, and why not just re-render?*\n302/303 redirect; re-rendering means the browser's last \"request\" was still the POST — a refresh would prompt to resend form data, potentially causing duplicate DB writes (e.g., duplicate orders)."}, {"id": "Q86", "tag": "⭐", "title": "What does `get_or_create()` do, and what's a common pitfall?", "body": "It looks up an object matching given kwargs; if not found, creates it — returns a `(object, created)` tuple. Pitfall: it's not fully atomic under high concurrency (two simultaneous requests can both find \"not found\" and try creating), which can raise an `IntegrityError` if there's a unique constraint — you should catch that or wrap in `transaction.atomic()`.\n*Follow-up: What's `update_or_create()` used for?*\nSame lookup-or-create logic as `get_or_create`, but if found, it also updates the object with provided `defaults` values.\n**Use case:** Tagging a blog post with \"django\" — you don't want to accidentally create a duplicate \"django\" tag every single time someone reuses that tag name. `get_or_create()` finds the existing one if it's already there, or creates it once if it isn't."}, {"id": "Q87", "tag": "", "title": "Explain Django's `is_valid()` on forms — what does it actually do?", "body": "It runs field-level validation (`clean_<field>` methods, built-in validators) and form-level `clean()`, populating `form.cleaned_data` and `form.errors`. Returns `True` only if no errors were raised.\n*Follow-up: Can you access `cleaned_data` before calling `is_valid()`?*\nNo — `cleaned_data` is only populated after `is_valid()`/`full_clean()` runs; accessing it before raises an `AttributeError` or gives stale/no data."}, {"id": "Q88", "tag": "", "title": "Wha
