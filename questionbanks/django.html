t is `django.contrib.sites`?", "body": "A framework for supporting multiple sites/domains with a single Django codebase and database, letting you attach content/config to specific site records — commonly used by things like `django-flatpages` or multi-tenant style setups.\n*Follow-up: Is this commonly used in modern Django apps?*\nNot as much anymore — many modern multi-tenant setups use dedicated multi-tenancy packages (e.g., `django-tenants`) or separate deployments/subdomains handled at the infra level instead."}, {"id": "Q89", "tag": "", "title": "What is the difference between `STATIC_URL`/`STATIC_ROOT` and `MEDIA_URL`/`MEDIA_ROOT`?", "body": "Static files (`STATIC_*`) are developer-provided assets (CSS/JS/images bundled with code), collected via `collectstatic`. Media files (`MEDIA_*`) are user-uploaded content (profile pictures, documents) stored/served separately, usually never checked into version control.\n*Follow-up: Why shouldn't user-uploaded media be served directly by Django in production?*\nDjango (via Gunicorn workers) isn't optimized for serving binary files efficiently at scale; it's better handled by Nginx, a CDN, or object storage (S3 + CloudFront) directly."}, {"id": "Q90", "tag": "", "title": "What does `python manage.py shell_plus` (django-extensions) offer over plain `shell`?", "body": "It auto-imports all your models (and commonly used utilities) into the shell session, saving you from manually importing every model you want to query/test interactively.\n*Follow-up: Name another useful `django-extensions` feature.*\n`runserver_plus` (Werkzeug debugger with interactive tracebacks), or `graph_models` (visualize model relationships as a diagram)."}, {"id": "Q91", "tag": "", "title": "What is a \"fat model, thin view\" philosophy in Django?", "body": "Business logic should live on models (or model managers/services), not sprawled across views — views should mainly orchestrate: validate input, call model/service methods, return a response. Keeps logic reusable (same logic usable from views, admin, management commands, Celery tasks) and easier to test.\n*Follow-up: What's the alternative pattern some teams prefer instead?*\nA dedicated \"services\" layer — plain functions/classes handling business logic outside models entirely, keeping models focused purely on data/schema — useful when logic spans multiple models and doesn't naturally belong to just one."}, {"id": "Q92", "tag": "", "title": "What is a Django management command, and how do you create one?", "body": "A custom CLI command runnable via `manage.py <command>` — created by adding a `management/commands/<name>.py` file with a `Command` class subclassing `BaseCommand` and implementing `handle()`.\n*Follow-up: Give an example of when you'd write one.*\nA recurring maintenance task like \"deactivate users inactive for 1 year\" or a one-off data migration/cleanup script, runnable manually or via a cron job/Celery Beat."}, {"id": "Q93", "tag": "", "title": "What is `django.core.exceptions.ValidationError` used for, and where does it commonly show up?", "body": "Raised to signal invalid data — inside model `clean()` methods, form `clean_<field>()`, or custom validators — carrying an error message (and optional error code) that forms/admin can display to the user.\n*Follow-up: Does `save()` automatically call `full_clean()`/run model-level validation?*\nNo — `Model.save()` does NOT automatically validate; you must explicitly call `full_clean()` before `save()` if you want model-level validators enforced outside of `ModelForm` (which calls it for you)."}, {"id": "Q94", "tag": "", "title": "What is the difference between `TemplateView` and just returning `render()` in a function view?", "body": "Functionally similar, but `TemplateView` is class-based and lets you override `get_context_data()` and reuse via inheritance/mixins; a plain FBV with `render()` is more direct/explicit for a simple static-ish page.\n*Follow-up: When is a CBV clearly the wrong choice?*\nWhen the view logic is highly conditional/branchy and doesn't map cleanly onto CRUD-style generic view methods — forcing it into a CBV often makes the code harder to follow than a straightforward function."}, {"id": "Q95", "tag": "", "title": "What's the purpose of `APPEND_SLASH` setting?", "body": "When `True` (default), if a URL without a trailing slash doesn't match any pattern, Django redirects to the same URL with a trailing slash appended (if that one does match) — a convenience for URL consistency.\n*Follow-up: Why might this cause an issue with POST requests?*\nThe redirect is a GET-based 301, so if the original request was a POST, the data would be lost on redirect — always define URL patterns matching your intended slash convention consistently instead of relying on this fallback for POST endpoints."}, {"id": "Q96", "tag": "", "title": "What is `django.utils.timezone` and why should you use it instead of Python's `datetime.now()`?", "body": "It provides timezone-aware datetime handling (`timezone.now()`) consistent with Django's `USE_TZ` setting, avoiding naive-datetime bugs when comparing/storing times across different timezones.\n*Follow-up: What happens if `USE_TZ=True` but you use naive datetimes (`datetime.now()`) in your code?*\nDjango raises `RuntimeWarning`s about naive datetimes and can produce incorrect comparisons/off-by-timezone-offset bugs when saved/queried against timezone-aware DB columns."}, {"id": "Q97", "tag": "", "title": "What is `django.contrib.contenttypes` used for?", "body": "It allows models to have a generic foreign key to *any* other model — useful for things like a generic \"Comment\" or \"Tag\" model that can attach to multiple different model types without a separate FK field for each.\n*Follow-up: What's the downside of using GenericForeignKey heavily?*\nNo real DB-level referential integrity/JOIN support (it's essentially two columns: content type + object id), so queries are less efficient and you lose some ORM conveniences like `select_related` across the generic relation."}, {"id": "Q98", "tag": "", "title": "What are Django \"mixins\" and how are they used with CBVs?", "body": "Mixin classes provide a single piece of reusable behavior (e.g., `LoginRequiredMixin`, `UserPassesTestMixin`) meant to be combined via multiple inheritance with a base CBV, following Python's MRO — mixins go **before** the main view class in the inheritance list.\n*Follow-up: Why does mixin ordering matter?*\nPython resolves methods left-to-right via MRO; if a mixin's `dispatch()` needs to run its check *before* the view's logic, it must appear before the base view class, or its override won't take effect properly."}, {"id": "Q99", "tag": "", "title": "What's the difference between `Model._meta` and `Meta` class?", "body": "`Meta` (inner class you define) sets configuration options declaratively. `Model._meta` is the actual runtime API object Django builds from that config (and more) — used internally/by introspection tools to get field lists, DB table name, etc.\n*Follow-up: Give a practical use of accessing `_meta` directly.*\nDynamically getting all field names of a model (e.g., `[f.name for f in MyModel._meta.get_fields()]`) for generic serialization/export utilities without hardcoding field names."}, {"id": "Q100", "tag": "", "title": "What is the purpose of `django.setup()` when using Django outside of `manage.py` (e.g., in a standalone script)?", "body": "It initializes the app registry (loading `INSTALLED_APPS`, configuring settings) so ORM/model access works properly in a standalone script — needed after manually setting `DJANGO_SETTINGS_MODULE` via `os.environ`.\n*Follow-up: Why can't you just import models directly in a plain Python script without this setup?*\nDjango needs its app registry populated (models registered, apps configured) before any model class can be used correctly; without `django.setup()`, you'll hit `AppRegistryNotReady` errors."}, {"id": "Q101", "tag": "", "title": "What is the difference between `apps.py`'s `ready()` method use case vs putting the same logic in `__init__.py`?", "body": "`ready()` is guaranteed to run only after the app registry is fully loaded — safe place to connect signals, register checks. Code in `__init__.py` runs very early, potentially before other apps/models are ready, risking `AppRegistryNotReady` or circular import errors.\n*Follow-up: What's a common mistake when connecting signals in `ready()`?*\nImporting the signal receiver's module directly at the top of `ready()` in a way that causes circular imports — best practice is to import the receiver function *inside* `ready()`, not at the top of `apps.py`."}, {"id": "Q102", "tag": "", "title": "What is a \"thundering herd\" problem in caching, and how might it relate to Django cache usage?", "body": "When a popular cached key expires, many simultaneous requests can all miss the cache at once and hit the database/expensive computation simultaneously, spiking load. Mitigations: staggered expiry (jitter), cache locking, or serving slightly stale data while one request recomputes.\n*Follow-up: How would you add \"jitter\" to cache timeouts in Django?*\nInstead of a fixed `cache.set(key, value, timeout=300)`, use `timeout=300 + random.randint(0, 30)` so different keys/instances don't all expire at the exact same moment."}]}, {"num": "12", "title": "Hands-On Coding Round (Write / Fix / Optimize)", "intro": "These are the kind of \"open a shared editor and code this\" questions asked at the 1–2 YOE level. They test whether you can actually *write* Django, not just talk about it. Try each one yourself first, then check the answer.", "questions": [{"id": "C1", "tag": "", "title": "Write a model for a `Book` with a title, an author (FK to a separate `Author` model), a price, and a `published_date`. Add a `Meta` option so books are ordered by `published_date` descending by default.", "body": "```python\nclass Author(models.Model):\n    name = models.CharField(max_length=200)\n\n    def __str__(self):\n        return self.name\n\n\nclass Book(models.Model):\n    title = models.CharField(max_length=255)\n    author = models.ForeignKey(Author, on_delete=models.CASCADE, related_name='books')\n    price = models.DecimalField(max_digits=8, decimal_places=2)\n    published_date = models.DateField()\n\n    class Meta:\n        ordering = ['-published_date']\n\n    def __str__(self):\n        return self.title\n```\n*Follow-up: Why `DecimalField` instead of `FloatField` for price?*\n`FloatField` uses binary floating point, which can introduce rounding errors in currency calculations (e.g., `0.1 + 0.2 != 0.3` in float math). `DecimalField` stores exact fixed-point values — the correct choice for money."}, {"id": "C2", "tag": "🔥", "title": "Given the code below, spot the N+1 query problem and fix it.", "body": "```python\n# views.py\ndef book_list(request):\n    books = Book.objects.all()\n    return render(request, 'books.html', {'books': books})\n```\n```html\n<!-- books.html -->\n{% for book in books %}\n  <p>{{ book.title }} by {{ book.author.name }}<\/p>\n{% endfor %}\n```\n**Answer:** Each `book.author.name` access triggers a separate query per book (N+1). Fix with `select_related`:\n```python\nbooks = Book.objects.select_related('author').all()\n```\n*Follow-up: What if the template also looped through each book's reviews (`book.review_set.all`)?*\nThat's a reverse FK (many rows per book), so you'd add `.prefetch_related('review_set')` on top: `Book.objects.select_related('author').prefetch_related('review_set')`."}, {"id": "C3", "tag": "", "title": "Write a DRF `ModelSerializer` for `Book` that exposes `title`, `author_name` (a custom read-only field derived from `book.author.name`), and `price`.", "body": "```python\nclass BookSerializer(serializers.ModelSerializer):\n    author_name = serializers.SerializerMethodField()\n\n    class Meta:\n        model = Book\n        fields = ['id', 'title', 'author_name', 'price']\n\n    def get_author_name(self, obj):\n        return obj.author.name\n```\n*Follow-up: How would you make `author_name` writable too (accept a name string on create and look up/create the Author)?*\nRemove `SerializerMethodField` and instead override `create()`:\n```python\ndef create(self, validated_data):\n    author_name = self.initial_data.get('author_name')\n    author, _ = Author.objects.get_or_create(name=author_name)\n    return Book.objects.create(author=author, **validated_data)\n```"}, {"id": "C4", "tag": "🔥", "title": "Fix the race condition in this view that decrements stock on order.", "body": "```python\ndef place_order(request, product_id):\n    product = Product.objects.get(id=product_id)\n    if product.stock > 0:\n        product.stock -= 1\n        product.save()\n        Order.objects.create(product=product, user=request.user)\n```\n**Problem:** Two simultaneous requests can both read `stock > 0` before either saves, both decrement, and stock can go negative.\n**Fix — use `F()` with an atomic update guarded by the condition, inside a transaction with row locking:**\n```python\nfrom django.db import transaction\n\ndef place_order(request, product_id):\n    with transaction.atomic():\n        product = Product.objects.select_for_update().get(id=product_id)\n        if product.stock > 0:\n            product.stock = F('stock') - 1\n            product.save(update_fields=['stock'])\n            Order.objects.create(product=product, user=request.user)\n        else:\n            return HttpResponseBadRequest(\"Out of stock\")\n```\n*Follow-up: What does `select_for_update()` do exactly, and what's a downside of it?*\nIt locks the selected row(s) in the database until the surrounding transaction commits, so concurrent transactions trying to update the same row must wait. Downside: under high concurrency/contention it can cause requests to queue up and increase latency, or deadlocks if lock ordering isn't consistent across transactions."}, {"id": "C5", "tag": "", "title": "Write a custom model manager that returns only \"published\" posts, and keep the default manager available too.", "body": "```python\nclass PublishedManager(models.Manager):\n    def get_queryset(self):\n        return super().get_queryset().filter(status='published')\n\n\nclass Post(models.Model):\n    STATUS_CHOICES = [('draft', 'Draft'), ('published', 'Published')]\n    title = models.CharField(max_length=200)\n    status = models.CharField(max_length=10, choices=STATUS_CHOICES, default='draft')\n\n    objects = models.Manager()      # default manager, must define explicitly to keep it\n    published = PublishedManager()  # custom manager\n```\n*Follow-up: Why does `objects = models.Manager()` need to be listed before `published = PublishedManager()`?*\nDjango uses the **first** manager declared on the class as the default (`_default_manager`), used internally e.g. by `to_field` lookups and admin. Order matters if you want `objects` to remain the default rather than `published`."}, {"id": "C6", "tag": "", "title": "Write a view (FBV) that returns a JSON list of books with just `id` and `title`, handling the case where the DB has no books.", "body": "```python\nfrom django.http import JsonResponse\n\ndef book_titles(request):\n    books = list(Book.objects.values('id', 'title'))\n    return JsonResponse({'books': books}, safe=True)\n```\n*Follow-up: Why does `JsonResponse` need `safe=False` if you pass a plain list instead of a dict?*\nBy default `JsonResponse` only allows serializing a `dict` (to prevent a known JSON security issue with top-level JSON arrays in older browsers). Passing `safe=False` explicitly opts in to serializing non-dict types like a list."}, {"id": "C7", "tag": "", "title": "Given this ModelForm, add validation so `price` cannot be negative.", "body": "```python\nclass BookForm(forms.ModelForm):\n    class Meta:\n        model = Book\n        fields = ['title', 'author', 'price', 'published_date']\n```\n**Answer — add a `clean_price` method:**\n```python\nclass BookForm(forms.ModelForm):\n    class Meta:\n        model = Book\n        fields = ['title', 'author', 'price', 'published_date']\n\n    def clean_price(self):\n        price = self.cleaned_data['price']\n        if price < 0:\n            raise forms.ValidationError(\"Price cannot be negative.\")\n        return price\n```\n*Follow-up: How would you instead enforce this at the database/model level so it's always validated, even from the admin or shell?*\nAdd a `CheckConstraint` in the model's `Meta`:\n```python\nclass Meta:\n    constraints = [\n        models.CheckConstraint(check=models.Q(price__gte=0), name='price_non_negative')\n    ]\n```"}, {"id": "C8", "tag": "", "title": "Write a Django signal that automatically creates a `Profile` object whenever a new `User` is created.", "body": "```python\n# signals.py\nfrom django.db.models.signals import post_save\nfrom django.dispatch import receiver\nfrom django.contrib.auth.models import User\nfrom .models import Profile\n\n@receiver(post_save, sender=User)\ndef create_profile(sender, instance, created, **kwargs):\n    if created:\n        Profile.objects.create(user=instance)\n```\n```python\n# apps.py\nclass AccountsConfig(AppConfig):\n    name = 'accounts'\n\n    def ready(self):\n        import accounts.signals  # noqa\n```\n*Follow-up: Why check `if created:` instead of running this on every save?*\nWithout it, the signal would try to create a duplicate `Profile` (likely raising an `IntegrityError` on a OneToOne field) every time the user object is updated, not just when it's first created."}, {"id": "C9", "tag": "🔥", "title": "Write a Celery task that sends a welcome email, and call it from a view without blocking the request.", "body": "```python\n# tasks.py\nfrom celery import shared_task\nfrom django.core.mail import send_mail\n\n@shared_task(bind=True, max_retries=3)\ndef send_welcome_email(self, user_email):\n    try:\n        send_mail(\n            'Welcome!',\n            'Thanks for signing up.',\n            'noreply@example.com',\n            [user_email],\n        )\n    except Exception as exc:\n        raise self.retry(exc=exc, countdown=60)\n```\n```python\n# views.py\ndef signup(request):\n    # ... create user ...\n    send_welcome_email.delay(user.email)\n    return redirect('home')\n```\n*Follow-up: What happens to `send_welcome_email.delay()` if Celery/Redis is down at that moment?*\n`.delay()` just publishes the task message to the broker; if the broker itself is unreachable, it raises a connection error at call time (which you'd need to handle/catch), whereas if only the *workers* are down, the task sits queued in the broker until a worker comes back online."}, {"id": "C10", "tag": "", "title": "Optimize this queryset that's causing a slow page load — it fetches all orders and, for each, counts related items and sums their total.", "body": "```python\n# Slow version\norders = Order.objects.all()\nfor order in orders:\n    order.item_count = order.items.count()\n    order.total = sum(item.price * item.qty for item in order.items.all())\n```\n**Optimized — push the aggregation into the database with `annotate()`:**\n```python\nfrom django.db.models import Count, Sum, F\n\norders = Order.objects.annotate(\n    item_count=Count('items'),\n    total=Sum(F('items__price') * F('items__qty'))\n)\n```\n*Follow-up: Why is this drastically faster than the loop version?*\nThe loop version runs 2 extra queries **per order** (one for `.count()`, one for `.all()` to sum in Python) — for 100 orders that's ~200+ queries. The annotated version computes everything in a single SQL query using JOINs and aggregate functions, regardless of how many orders there are."}, {"id": "C11", "tag": "⭐", "title": "Write a DRF permission class that only allows the object's owner to update/delete it, but anyone to read it.", "body": "```python\nfrom rest_framework import permissions\n\nclass IsOwnerOrReadOnly(permissions.BasePermission):\n    def has_object_permission(self, request, view, obj):\n        if request.method in permissions.SAFE_METHODS:\n            return True\n        return obj.owner == request.user\n```\n```python\nclass PostViewSet(viewsets.ModelViewSet):\n    queryset = Post.objects.all()\n    serializer_class = PostSerializer\n    permission_classes = [permissions.IsAuthenticatedOrReadOnly, IsOwnerOrReadOnly]\n```\n*Follow-up: What's the difference between `has_permission()` and `has_object_permission()`, and why do you need both here?*\n`has_permission()` runs first, before DRF even fetches a specific object (e.g., for `list`/`create`) — it's a general access check. `has_object_permission()` runs only for detail-level actions (retrieve/update/delete) once a specific object is fetched, since it needs the object to compare `obj.owner`. You need `IsAuthenticatedOrReadOnly` for the general \"must be logged in to write anything\" check and `IsOwnerOrReadOnly` for the per-object ownership check."}, {"id": "C12", "tag": "", "title": "Given a `Product` model with a `category` FK, write a query to find all categories that have more than 5 products.", "body": "```python\nfrom django.db.models import Count\n\nCategory.objects.annotate(\n    product_count=Count('product')\n).filter(product_count__gt=5)\n```\n*Follow-up: What if you only want to count products where `is_active=True`?*\nUse a conditional `Count` with `filter=` inside the aggregate:\n```python\nfrom django.db.models import Q\n\nCategory.objects.annotate(\n    product_count=Count('product', filter=Q(product__is_active=True))\n).filter(product_count__gt=5)\n```"}, {"id": "C13", "tag": "🔥", "title": "Write a simple pagination-ready DRF `ListAPIView` for `Book`, with search by title.", "body": "```python\nfrom rest_framework import generics, filters\n\nclass BookListView(generics.ListAPIView):\n    queryset = Book.objects.select_related('author').all()\n    serializer_class = BookSerializer\n    filter_backends = [filters.SearchFilter]\n    search_fields = ['title']\n```\n*Follow-up: How would you add ordering support (e.g., `?ordering=price`) on top of this?*\nAdd `filters.OrderingFilter` to `filter_backends` and set `ordering_fields = ['price', 'published_date']`."}, {"id": "C14", "tag": "", "title": "Spot the bug: this code is meant to bulk-update a discount field on a queryset but the signal-based email notification for stock changes never fires.", "body": "```python\nProduct.objects.filter(category='clearance').update(discount=20)\n```\n**Answer:** `update()` is a QuerySet-level bulk SQL `UPDATE` — it does **not** call `save()` on each instance, so `pre_save`/`post_save` signals never fire.\n**Fix (if signals must run), loop and save individually — accepting the performance cost:**\n```python\nfor product in Product.objects.filter(category='clearance'):\n    product.discount = 20\n    product.save()  # triggers signals\n```\n*Follow-up: Is there a middle-ground for large datasets where looping row-by-row is too slow?*\n`bulk_update()` is faster than looping with individual `.save()` calls but, like `update()`, it also skips signals — so if signals are required, you either accept the loop's cost, batch it (chunk 1000 rows at a time with `save()`), or manually fire the relevant signal/event after the bulk operation."}, {"id": "C15", "tag": "", "title": "Write a test for a DRF endpoint that creates a `Book` and asserts the response.", "body": "```python\nfrom rest_framework.test import APITestCase\nfrom rest_framework import status\nfrom django.contrib.auth.models import User\n\nclass BookAPITests(APITestCase):\n    def setUp(self):\n        self.user = User.objects.create_user(username='test', password='pass123')\n        self.author = Author.objects.create(name='J.K. Rowling')\n\n    def test_create_book(self):\n        self.client.force_authenticate(user=self.user)\n        payload = {\n            'title': 'Test Book',\n            'author': self.author.id,\n            'price': '9.99',\n            'published_date': '2024-01-01',\n        }\n        response = self.client.post('/api/books/', payload)\n        self.assertEqual(response.status_code, status.HTTP_201_CREATED)\n        self.assertEqual(Book.objects.count(), 1)\n        self.assertEqual(Book.objects.first().title, 'Test Book')\n```\n*Follow-up: How would you test that an unauthenticated user gets a 401/403 on the same endpoint?*\nSkip `force_authenticate` (or explicitly don't call it), send the same POST, and assert `response.status_code == status.HTTP_401_UNAUTHORIZED` (or 403, depending on the authentication scheme configured — session auth typically returns 403 for unauthenticated write attempts, token/JWT often returns 401)."}, {"id": "C16", "tag": "⭐", "title": "Add a custom DRF endpoint `POST /orders/{id}/cancel/` to an existing `OrderViewSet` that only works if the order isn't already shipped.", "body": "```python\nfrom rest_framework.decorators import action\nfrom rest_framework.response import Response\nfrom rest_framework import status, viewsets\n\nclass OrderViewSet(viewsets.ModelViewSet):\n    queryset = Order.objects.all()\n    serializer_class = OrderSerializer\n\n    @action(detail=True, methods=['post'])\n    def cancel(self, request, pk=None):\n        order = self.get_object()\n        if order.status == 'shipped':\n            return Response(\n                {'error': 'Cannot cancel an order that has already shipped.'},\n                status=status.HTTP_400_BAD_REQUEST\n            )\n        order.status = 'cancelled'\n        order.save(update_fields=['status'])\n        return Response(OrderSerializer(order).data)\n```\n*Follow-up: Why use `self.get_object()` here instead of `Order.objects.get(pk=pk)` directly?*\n`self.get_object()` also runs the ViewSet's configured permission checks (`has_object_permission`) and raises a proper `404` via `get_object_or_404` semantics — fetching the object manually would skip both, so a user without permission on that specific order could still act on it."}, {"id": "C17", "tag": "⭐", "title": "Implement soft delete for a `Post` model: deleting a post should just set a flag, and the default manager should hide deleted posts everywhere.", "body": "```python\nfrom django.db import models\n\nclass PostQuerySet(models.QuerySet):\n    def alive(self):\n        return self.filter(is_deleted=False)\n\n    def dead(self):\n        return self.filter(is_deleted=True)\n\n    def delete(self):\n        # catches bulk queryset.delete() calls too, not just instance.delete()\n        return self.update(is_deleted=True)\n\n\nclass Post(models.Model):\n    title = models.CharField(max_length=200)\n    is_deleted = models.BooleanField(default=False)\n\n    objects = PostQuerySet.as_manager()          # default: use .alive() explicitly where needed\n    all_objects = models.Manager()               # escape hatch to see everything, including deleted\n\n    def delete(self, *args, **kwargs):\n        self.is_deleted = True\n        self.save(update_fields=['is_deleted'])\n```\n*Follow-up: This still doesn't hide deleted posts automatically on `Post.objects.all()` — how would you fix that?*\nOverride `get_queryset()` on a custom manager to call `.alive()` by default: `class ActiveManager(models.Manager): def get_queryset(self): return PostQuerySet(self.model, using=self._db).alive()`, then assign `objects = ActiveManager()` — now the default manager only ever returns non-deleted posts, while `all_objects` remains available for admin/recovery use cases."}]}, {"num": "13", "title": "System Design \"Lite\" (Increasingly Asked Even at 1–2 YOE)", "intro": "Cross-checking current (2025–2026) backend/junior-engineer interview breakdowns confirms this is real, not filler: these specific problems are consistently listed as the standard **junior-level** system design set (as opposed to Twitter/Uber/Google Docs-scale problems reserved for senior rounds). You won't be expected to whiteboard Kafka partitioning — you're expected to reason about **requirements → data model → bottleneck → one scaling fix**, and tie it back to Django/DRF specifically.\n\n**A simple 4-step structure that works for all of these (say this out loud in the interview):**\n1. **Clarify scope** — read/write ratio, expected scale, must-have vs nice-to-have features\n2. **Data model** — what tables/models, what's the primary key/lookup pattern\n3. **Naive Django implementation** — how you'd actually build it with models/views/DRF\n4. **Where it breaks at scale, and the one fix** — usually caching, an index, or moving something to async/Celery\n\n---", "questions": [{"id": "D1", "tag": "🔥", "title": "Design a URL shortener (like Bitly/TinyURL) using Django.", "body": "This is the single most commonly cited \"junior system design\" question across current prep sources — practically guaranteed at some companies.\n\n**Answer:**\n- **Data model:** one `Link` model — `id`, `long_url`, `short_code` (indexed, unique), `created_at`, `click_count`, optional `expires_at`, optional `owner` FK.\n- **Generating the short code:** don't hash the URL (collisions, and same URL submitted twice would need dedup logic anyway). Simpler and interview-safe: auto-increment the model's PK, then Base62-encode that integer into the short code (`1` → `\"1\"`, `62` → `\"10\"`, etc.) — guarantees uniqueness for free, no collision handling needed.\n- **Write path (`POST /shorten`):** validate the long URL, create the `Link` row, encode its `id` to get `short_code`, return the short URL.\n- **Read path (`GET /<short_code>`):** decode `short_code` back to an integer PK (or just look it up directly if you store `short_code` as an indexed column), fetch the `long_url`, return an `HttpResponseRedirect` (302, since it's a link, not permanent — or offer 301 if you want browsers/search engines to cache it).\n- **Where it breaks at scale:** redirects (`GET`) vastly outnumber creations (`POST`) — this is an extremely read-heavy workload. The DB becomes the bottleneck if every redirect hits Postgres.\n- **The fix:** cache `short_code → long_url` mappings in Redis with a TTL; check cache first, fall back to DB on miss and repopulate cache. Also move `click_count` increments off the hot path — increment in Redis and flush to DB periodically via a Celery task, instead of writing to Postgres on every single redirect.\n*Follow-up: Why Base62 encoding of the PK instead of a random string?*\nA random string needs a uniqueness check against the DB before use (extra query, and a retry loop on collision). Encoding an auto-incrementing PK is deterministic and collision-free by construction — no extra lookup needed."}, {"id": "D2", "tag": "🔥", "title": "Design a rate limiter for a Django REST Framework API.", "body": "Also listed constantly as a standard junior/mid system design pick — and it maps directly onto something DRF already does (throttling), which is exactly why interviewers like asking it to Django candidates specifically.\n\n**Answer:**\n- **Naive/local version:** DRF's built-in `UserRateThrottle`/`AnonRateThrottle` use Django's cache framework to store a request count per user/IP within a time window (fixed-window algorithm by default).\n- **The core problem to discuss:** if you're running multiple app servers/workers, an in-memory (local) cache means each worker has its own counter — a client could get `N` requests per worker instead of `N` total. **Fix:** back the cache with Redis (shared, external store) so all workers see the same counter.\n- **Algorithm tradeoffs (say these explicitly):**\n  - *Fixed window* (what DRF does by default): simple, but allows a burst of `2N` requests right at the window boundary (e.g., N requests at 0:59, N more at 1:00).\n  - *Sliding window*: smooths that boundary-burst problem out, more accurate, slightly more complex to implement (weighted count across two windows, or a sorted-set-of-timestamps approach in Redis).\n  - *Token bucket*: allows controlled bursts while enforcing an average rate — common choice for APIs that want to tolerate occasional spikes.\n- **Response when limited:** return `429 Too Many Requests` with a `Retry-After` header — DRF's throttle classes do this automatically.\n*Follow-up: How would you apply a stricter limit specifically on the login endpoint vs general API endpoints?*\nAttach a custom throttle class (subclassing `SimpleRateThrottle` with its own `scope`) just to the login view's `throttle_classes`, with a tighter `DEFAULT_THROTTLE_RATES` entry for that scope (e.g., `'login': '5/min'`) — separate from the general API-wide throttle rate."}, {"id": "D3", "tag": "⭐", "title": "Design a notification system (email/SMS/push) triggered by events in a Django app — e.g., \"notify user when their order ships.\"", "body": "Repeatedly listed as a standard mid-level-and-up pick, but the *simplified* version (\"just wire this into a Django app\") is realistic at 1–2 YOE, especially if you've touched Celery.\n\n**Answer:**\n- **Never send notifications synchronously inside the request/view** — an email/SMS provider call can be slow or fail, and you don't want to block the HTTP response (e.g., completing an order) on it.\n- **Pattern:** the triggering event (e.g., `Order.status` changes to `'shipped'`) fires a Django signal or an explicit service-layer call, which enqueues a Celery task (`send_notification.delay(order_id)`).\n- **The Celery task** looks up the user's notification preferences (email vs SMS vs push — respect opt-outs), calls the relevant provider (SendGrid/Twilio/FCM), and logs the delivery attempt.\n- **Reliability concerns to mention:** retries with backoff for transient provider failures (`self.retry(...)`), idempotency (don't double-send if a task is retried — dedupe using a unique key per event), and a `NotificationLog` model so you can audit what was sent/failed.\n- **Where it breaks at scale:** a single Celery queue mixing \"send welcome email\" with \"process this month's 2 million billing reminders\" causes urgent notifications to queue behind bulk ones. **Fix:** separate Celery queues by priority/channel, with dedicated workers per queue.\n*Follow-up: How do you avoid sending the same notification twice if the Celery task is retried after a network blip mid-send?*\nDesign the task to be idempotent — check a `NotificationLog` (or a Redis flag) for \"already sent for this event ID\" before dispatching, so a retry after a partial failure doesn't double-notify the user."}, {"id": "D4", "tag": "⭐", "title": "Design a background job/task processing system (e.g., users upload a CSV, it's processed asynchronously) using Django + Celery.", "body": "Comes up specifically because it's the most natural \"system design\" question for someone who's actually used Celery in a real Django job — very fair to ask at 1–2 YOE.\n\n**Answer:**\n- **Flow:** user uploads file via a Django view → save the file, create a `Job` model row with `status='pending'` → `process_csv.delay(job.id)` enqueues a Celery task → return the `job.id` to the frontend immediately (don't block).\n- **Frontend polls** `GET /jobs/<id>/status` (or you push updates via WebSockets/Channels if you want to go further) to check `Job.status` (`pending` → `processing` → `done`/`failed`).\n- **The Celery task** updates `Job.status` and `Job.progress` as it works, catches exceptions and sets `status='failed'` with an error message rather than letting the task die silently.\n- **Where it breaks at scale:** one giant CSV (millions of rows) processed as a single task blocks a worker for a long time and risks task timeout. **Fix:** chunk the file and fan out into multiple smaller Celery tasks (a \"chord\"/group of tasks), or stream-process row by row instead of loading the whole file into memory.\n*Follow-up: What happens if a worker crashes mid-task — does the job just get lost?*\nDepends on the broker's acknowledgment settings — with `acks_late=True`, Celery redelivers the task to another worker if the original dies before finishing; without it, a crashed worker can lose an in-progress task. Also worth mentioning: this is exactly why the `Job.status` should be updated incrementally, not just set to \"done\" at the very end, so partial progress isn't invisible."}, {"id": "D5", "tag": "💡", "title": "Design a \"Pastebin\"-like service (users submit text, get a shareable link, optional expiry) with Django.", "body": "Frequently listed alongside URL shorteners as the other classic beginner-tier system design pick — same shape of problem, worth recognizing even though URL shorteners get asked more often.\n\n**Answer:** Nearly identical shape to the URL shortener (D1): a `Paste` model (`content`, `short_code`, `created_at`, `expires_at`, `is_private`). Key differences to raise: storing large text blobs directly in Postgres is fine up to a point, but for very large pastes you'd move `content` to object storage (S3) and store just a reference/key in the DB row. Expiry can be handled with a periodic Celery Beat task that deletes/archives expired pastes, or lazily — check `expires_at` on read and treat it as \"not found\" if expired (avoids a cron job, but leaves dead rows until cleaned up).\n*Follow-up: How would you support \"burn after reading\" (paste is deleted after first view)?*\nOn the read view, wrap the fetch-and-delete in `transaction.atomic()` with `select_for_update()` so two simultaneous requests for the same paste can't both see it before either delete happens — otherwise you risk a race where it gets served twice."}, {"id": "D6", "tag": "⭐", "title": "Design a simple multi-tenant SaaS backend in Django (e.g., a helpdesk tool used by many companies).", "body": "Repeats the shared-schema multi-tenancy idea from the gap-fill section above, but as a full system-design walkthrough — worth practicing out loud since \"add multi-tenancy to this schema\" is a natural extension interviewers tack onto other Django system-design questions once you've solved the base version.\n\n**Answer:**\n- **Schema:** every tenant-owned model (`Ticket`, `Customer`, `Agent`, …) gets an `organization` FK. A base abstract model with that FK plus a custom manager scoped to \"current tenant\" keeps this from being repeated ad hoc on every query.\n- **Resolving \"current tenant\":** a middleware runs early in the request cycle, resolves the tenant from the request (subdomain, e.g. `acme.helpdesk.com`, or an API key/header for API clients), and stores it somewhere request-scoped (commonly `request.tenant`, sometimes mirrored into a thread-local for code that doesn't have easy access to `request`).\n- **Enforcing isolation:** the biggest real risk in this design is a single unfiltered query anywhere in the codebase leaking one tenant's data to another — the fix is architectural, not just discipline: route all tenant-scoped queries through a manager/QuerySet that auto-filters by `request.tenant`, so leaving off the filter is the *unusual* thing a reviewer would notice, not the default.\n- **Where it breaks at scale:** a handful of very large tenants can dominate a shared database's resources and even affect smaller tenants' performance (\"noisy neighbor\"). **Fix:** monitor per-tenant query load, and have a migration path to move a large or sensitive tenant onto their own schema/database if needed — the shared-schema design doesn't have to be all-or-nothing forever.\n*Follow-up: How would this design change if one enterprise customer demanded their data live in a physically separate database for compliance reasons?*\nThat's exactly the \"separate database per tenant\" tier — the application layer would need a database router (or explicit `.using(tenant.db_alias)` calls) driven by the resolved tenant, so the same codebase can serve most tenants from a shared database while routing specific ones to their own isolated database."}]}, {"num": "14", "title": "Advanced ORM, Migrations & Multi-Database", "intro": "*Added in a gap-fill pass on top of the original 122 questions — see the note at the end of this document for how these were selected and tagged.*", "questions": [{"id": "E1", "tag": "⭐", "title": "What is a database router in Django, and when would you need one?", "body": "A router is a class with methods like `db_for_read()`, `db_for_write()`, and `allow_migrate()` that tells Django which database alias to use for a given model/operation, when `DATABASES` in settings defines more than one database. Registered via `DATABASE_ROUTERS` in settings.\n*Follow-up: Give a concrete case where you'd need one.*\nSending all read queries to a read-replica database while writes go to the primary — a router's `db_for_read()` returns the replica alias, `db_for_write()` returns the primary alias, reducing load on the primary for read-heavy traffic.\n**Use case:** An analytics dashboard runs heavy, slow aggregate queries. Pointing those specific queries at a read replica (via `.using('replica')` or a router) keeps them from competing with the primary database's normal transactional traffic."}, {"id": "E2", "tag": "💡", "title": "Why doesn't Django pool database connections by default, and what is `CONN_MAX_AGE` for?", "body": "Each Django worker process opens a new DB connection per request by default and closes it at the end (connection per request), which has overhead (TCP handshake, auth) at high request volume. `CONN_MAX_AGE` (in `DATABASES` settings) keeps a connection alive and reuses it across requests for a given number of seconds instead of reconnecting every time; `None` keeps it open indefinitely.\n*Follow-up: Why might you still want PgBouncer/connection pooling in front of Postgres even with `CONN_MAX_AGE` set?*\n`CONN_MAX_AGE` only reuses a connection *within a single worker process* — with many Gunicorn/uWSGI workers across multiple app server instances, you can still end up with far more open Postgres connections than the database can comfortably handle (Postgres connections are relatively expensive). A pooler like PgBouncer sits in front of Postgres and multiplexes many app-side connections onto a smaller pool of real database connections."}, {"id": "E3", "tag": "🔥", "title": "How do you add a `NOT NULL` column to a large, live production table without downtime?", "body": "Doing it in one step (`ALTER TABLE ... ADD COLUMN x NOT NULL`) either requires a default that forces a full table rewrite/lock on some databases, or simply fails on existing rows with no value. The safe pattern is multi-step: (1) add the column as nullable (or with a server-side default), (2) deploy code that starts writing the new column going forward, (3) run a backfill migration/script to populate existing rows in batches, (4) once fully backfilled, add a follow-up migration that makes the column `NOT NULL`.\n*Follow-up: Why do it in separate migrations/deploys instead of one?*\nEach step needs to be safe to run while the *old* code is still serving traffic — if you flip to `NOT NULL` before every row is backfilled and before the app code guarantees a value on write, you risk failed inserts/updates in the window between deploy and full backfill."}, {"id": "E4", "tag": "⭐", "title": "What is a Django \"data migration\" and what's the historical-models gotcha?", "body": "A data migration (created via `makemigrations --empty` and using `migrations.RunPython`) modifies actual row data rather than schema — e.g., backfilling a new field from an existing one. Inside `RunPython`, you must use `apps.get_model('app', 'ModelName')` (the \"historical\" version of the model as it existed at that point in migration history), not importing the real model class directly.\n*Follow-up: Why can't you just import the real model in a data migration?*\nThe real model may have fields/methods added or removed by migrations that run *after* this one — importing it directly could reference fields that don't exist yet at the point this migration actually runs (or later break when the real model changes further), whereas the historical model reflects the exact schema at that migration's position in history."}, {"id": "E5", "tag": "💡", "title": "What are transaction isolation levels, and which one does Postgres use by default?", "body": "Isolation levels control how much one transaction can \"see\" of another's in-progress changes. From loosest to strictest: `READ UNCOMMITTED` (dirty reads possible — rarely used), `READ COMMITTED` (Postgres's default — only sees committed data, but the same query run twice in one transaction can see different results if another transaction commits in between), `REPEATABLE READ` (a transaction sees a consistent snapshot for its whole duration), `SERIALIZABLE` (strictest — behaves as if transactions ran one at a time).\n*Follow-up: Where does `select_for_update()` fit into this?*\nIt's independent of isolation level — it explicitly locks the selected rows so other transactions trying to update/lock the same rows must wait, which is how Django lets you enforce read-modify-write safety even under the default `READ COMMITTED` level."}, {"id": "E6", "tag": "⭐", "title": "What do `.only()` and `.defer()` do, and what's the gotcha?", "body": "`.only('field1', 'field2')` fetches just the listed fields (and the PK) in the initial query. `.defer('field1')` fetches everything *except* the listed fields. Both are meant to reduce the amount of data pulled back for very wide tables.\n*Follow-up: What happens if you access a deferred field afterward?*\nDjango silently fires an extra query to fetch that single field for that single object — so using `.defer()`/`.only()` carelessly (e.g., in a loop where the \"deferred\" field ends up being accessed anyway) can quietly reintroduce an N+1 problem instead of solving one."}, {"id": "E7", "tag": "💡", "title": "What does `QuerySet.iterator()` do, and when would you use it?", "body": "Normally, iterating a QuerySet loads and caches all matching rows in memory once evaluated (so you can iterate it again without hitting the DB). `.iterator()` streams results from the database in chunks instead of caching the whole result set in memory — useful when processing millions of rows (e.g., a one-off export/cleanup script) where holding everything in memory at once isn't practical.\n*Follow-up: What's a tradeoff of using `.iterator()`?*\nYou lose the QuerySet's result caching — if you need to loop over the same data more than once, `.iterator()` will hit the database again each time, and it also doesn't play well with `prefetch_related()` in older Django versions (Django 4.1+ added limited support for this)."}, {"id": "E8", "tag": "⭐", "title": "How would you implement \"soft delete\" in Django, and what's the risk of overriding `delete()` naively?", "body": "Add an `is_deleted` (or `deleted_at`) field instead of actually removing rows, and give the model a custom manager whose `get_queryset()` filters out `is_deleted=True` by default (with a separate manager/method to access \"all including deleted\" when needed, e.g. for an admin recovery view).\n*Follow-up: Why isn't just overriding the model's `delete()` method enough?*\n`Model.delete()` only runs for a single instance calling `.delete()` directly — a bulk `SomeModel.objects.filter(...).delete()` call goes through `QuerySet.delete()`, which does **not** call the overridden instance method, so rows would still be hard-deleted unless you also override `QuerySet.delete()` (and route the manager through a custom QuerySet class via `Manager.from_queryset()` or similar) to catch the bulk path too."}]}, {"num": "15", "title": "Advanced DRF & API Design", "intro": "*Continuing the gap-fill pass — see the note at the end of this document.*", "questions": [{"id": "F1", "tag": "🔥", "title": "How do you support structured filtering on a DRF endpoint (e.g., `?category=fiction&min_price=10`) beyond simple search?", "body": "Use the `django-filter` package's `DjangoFilterBackend` with a `FilterSet` class that declares each filterable field (and lookup type, e.g. `min_price = django_filters.NumberFilter(field_name='price', lookup_expr='gte')`), then set `filterset_class` on the view alongside `filter_backends = [DjangoFilterBackend]`.\n*Follow-up: How is this different from DRF's built-in `SearchFilter`?*\n`SearchFilter` does a simple free-text `icontains`-style search across one or more specified fields via a single `?search=` param. `django-filter`'s `FilterSet` gives you distinct, independently combinable query parameters with their own types and lookup expressions (exact match, ranges, choices) — better suited to structured filter UIs than free-text search."}, {"id": "F2", "tag": "⭐", "title": "What is the `@action` decorator on a DRF `ViewSet` used for?", "body": "It adds a custom endpoint to a `ViewSet` beyond the standard list/retrieve/create/update/delete actions — e.g., `POST /orders/{id}/cancel/`. Decorate a method with `@action(detail=True, methods=['post'])` for an object-specific action, or `detail=False` for a collection-level one (e.g., `/orders/summary/`), and the router wires up the URL automatically.\n*Follow-up: How would you restrict a custom `@action` to a different permission than the rest of the ViewSet?*\nPass `permission_classes=[...]` directly to the `@action` decorator — it overrides the ViewSet's default `permission_classes` for just that action."}, {"id": "F3", "tag": "⭐", "title": "What are the common API versioning strategies in DRF, and what are the tradeoffs?", "body": "DRF supports several: URL path versioning (`/api/v1/books/`), query parameter versioning (`?version=1`), and header/Accept-based versioning (`Accept: application/json; version=1.0`). URL versioning is the most explicit and cache-friendly (different URLs, different caches) but \"pollutes\" the URL; header versioning keeps URLs clean but is easy for API consumers to forget to set and harder to test by just pasting a URL in a browser.\n*Follow-up: Which approach do most public APIs you've seen use, and why do you think that is?*\nURL path versioning is by far the most common in practice — it's the most discoverable and the simplest for API consumers and for routing/caching infrastructure to reason about, even though it's the \"least RESTful\" option in a strict sense."}, {"id": "F4", "tag": "💡", "title": "How do you auto-generate API documentation for a DRF project?", "body": "`drf-spectacular` (the current recommended tool) introspects your serializers, views, and permission/auth classes to generate an OpenAPI 3 schema, which can then be rendered as interactive Swagger UI or ReDoc pages.\n*Follow-up: Why might your generated schema be missing or wrong for a particular field?*\n`drf-spectacular` infers types from the serializer/model field definitions — heavily customized fields (e.g., a `SerializerMethodField` returning a complex/dynamic shape) often need an explicit `@extend_schema_field` hint, since the tool can't infer the return type of arbitrary Python code."}, {"id": "F5", "tag": "⭐", "title": "How do you make DRF error responses consistent across an entire API (e.g., always `{\"error\": {\"code\": ..., \"message\": ...}}`)?", "body": "Write a custom exception handler function and point `EXCEPTION_HANDLER` (in `REST_FRAMEWORK` settings) at it. It receives the exception and context, typically calls DRF's default `exception_handler()` first to get the standard response, then reshapes `response.data` into your project's consistent error format before returning it.\n*Follow-up: What happens to exceptions that aren't DRF `APIException` subclasses (e.g., a raw `ValueError` from your own code)?*\nDRF's default handler returns `None` for exceptions it doesn't recognize, which DRF then re-raises as an unhandled exception (resulting in a 500) unless your custom handler explicitly catches broader exception types and converts them into a proper error response too."}, {"id": "F6", "tag": "🔥", "title": "Explain access vs refresh tokens in JWT auth, and what \"blacklisting\" a token means.", "body": "An **access token** is short-lived (minutes) and sent with every API request to prove identity. A **refresh token** is longer-lived and used only to obtain a new access token once the old one expires, without forcing the user to log in again. Short-lived access tokens limit the damage window if one is stolen; the refresh token is used less often and can be stored more carefully.\n*Follow-up: JWTs are stateless by design — so how does \"logout\" or revoking a compromised token actually work?*\nSince a valid JWT can't be \"un-signed,\" you need an explicit deny-list: `djangorestframework-simplejwt`'s blacklist app stores revoked refresh tokens in the database and checks incoming refresh attempts against that list — access tokens themselves are usually just left to expire quickly rather than individually revoked, which is exactly why keeping their lifetime short matters."}, {"id": "F7", "tag": "💡", "title": "What does `django-guardian` add on top of Django's default permission system?", "body": "Django's built-in permissions are model-level (\"can this user change *any* `Post`?\"). `django-guardian` adds per-object permissions (\"can this user change *this specific* `Post`?\") backed by extra database tables, usable both in plain Django views/admin and DRF permission classes — an alternative to hand-rolling object-level checks like `obj.owner == request.user` everywhere.\n*Follow-up: When would you reach for `django-guardian` instead of a simple `obj.owner == request.user` check?*\nWhen permissions are more complex than single ownership — e.g., a document can be shared with multiple specific users or teams with different permission levels (view vs edit) — a hand-rolled `owner` field can't express that, but `django-guardian`'s per-object, per-user/group permission model can."}, {"id": "F8", "tag": "⭐", "title": "How do you write and register a custom Django authentication backend?", "body": "Subclass `django.contrib.auth.backends.BaseBackend` (or implement `authenticate(self, request, **credentials)` and `get_user(self, user_id)`), then list its dotted path in `AUTHENTICATION_BACKENDS` in settings. Django tries each configured backend in order until one successfully authenticates.\n*Follow-up: Give a realistic reason to write one instead of just customizing the User model.*\nLogging in with either an email or a phone number, or delegating authentication to an external system (LDAP, SSO/SAML, a legacy user database) — the backend decides *how* credentials are verified, independent of what fields the `User` model itself has."}]}, {"num": "16", "title": "Async, Celery Canvas & Real-Time", "intro": "*Continuing the gap-fill pass — see the note at the end of this document.*", "questions": [{"id": "G1", "tag": "⭐", "title": "What are Celery's \"canvas\" primitives — `chain`, `group`, and `chord` — and when would you use each?", "body": "`chain(a, b, c)` runs tasks strictly in sequence, passing each task's result into the next. `group(a, b, c)` runs tasks in parallel with no dependency between them. `chord(group(a, b, c), callback)` runs a group in parallel and then runs a single callback task once *all* of them finish, with their results collected.\n*Follow-up: Give a concrete example of when you'd reach for a `chord`.*\nResizing an uploaded image into five different thumbnail sizes in parallel (a `group`), then — once all five are done — running a single task that updates the `Image` model's status to \"ready\" and notifies the user (the `chord`'s callback)."}, {"id": "G2", "tag": "⭐", "title": "How do you route different Celery tasks to different queues, and why would you?", "body": "Configure `task_routes` (or `CELERY_ROUTES`) to map specific task names to specific queue names, then run dedicated workers listening only to each queue (`celery -A proj worker -Q high_priority`). Without this, all tasks share one default queue and one pool of workers.\n*Follow-up: What real problem does this solve?*\nWithout separate queues, a burst of low-priority bulk work (e.g., sending a monthly newsletter to 2 million users) can sit ahead of and delay urgent tasks (e.g., a password-reset email) simply because they were enqueued first — dedicated queues per priority/category prevent that head-of-line blocking."}, {"id": "G3", "tag": "💡", "title": "At a conceptual level, how do Django Channels and WebSockets fit into a Django project?", "body": "Channels extends Django to handle long-lived, bidirectional connections (WebSockets) alongside normal HTTP, using ASGI instead of WSGI. Incoming connections are routed to \"consumers\" (the WebSocket equivalent of a view), and a \"channel layer\" (commonly backed by Redis) lets different consumers/processes communicate — e.g., broadcasting a chat message from one user's consumer to every other connected consumer in the same room.\n*Follow-up: Why can't plain WSGI/regular Django views handle this?*\nWSGI is built around the request-comes-in, response-goes-out, connection-closes model — it has no concept of a connection that stays open and can push data to the client at any time without the client first asking; ASGI was designed specifically to support that longer-lived, bidirectional pattern."}, {"id": "G4", "tag": "💡", "title": "How do you test code that calls Celery tasks without needing a real broker/worker running?", "body": "Set `task_always_eager = True` (via `CELERY_TASK_ALWAYS_EAGER` in settings, typically only in the test settings) so `.delay()`/`.apply_async()` execute the task synchronously, in-process, immediately — no broker or worker needed. Pair with `task_eager_propagates = True` so exceptions raised inside the task actually surface in the test instead of being silently swallowed.\n*Follow-up: What's a downside of relying only on eager-mode tests?*\nIt doesn't catch bugs related to actual asynchronous behavior — serialization issues (arguments that aren't JSON-serializable), broker connectivity problems, or race conditions between the task and the code that queued it — since eager mode runs everything synchronously in the same process."}]}, {"num": "17", "title": "Testing, Security Hardening & Production Readiness", "intro": "*Continuing the gap-fill pass — see the note at the end of this document.*", "questions": [{"id": "H1", "tag": "🔥", "title": "What does `pytest-django` offer over Django's built-in `unittest`-style `TestCase`, and why have many teams moved to it?", "body": "It lets you write tests as plain functions (not forced into `TestCase` subclasses), provides fixtures like `db` (grants DB access only to tests that request it) and `client`, supports parametrized tests (`@pytest.mark.parametrize`) for running the same test logic against multiple inputs, and integrates with the wider pytest plugin ecosystem (coverage, mocking, parallel test runs).\n*Follow-up: What's the equivalent of Django's `TestCase` (transaction-wrapped) in pytest-django?*\nThe `@pytest.mark.django_db` marker (or the `db` fixture) gives a test database access wrapped in a transaction that's rolled back afterward, the same isolation guarantee `TestCase` provides — `transactional_db` is the `TransactionTestCase` equivalent when you need real commit/rollback behavior."}, {"id": "H2", "tag": "💡", "title": "What does test coverage measure, and what does a high percentage *not* guarantee?", "body": "Coverage tools (`coverage.py`, often via `pytest-cov`) track which lines/branches of code actually executed while the test suite ran, reported as a percentage of the codebase. A high number only tells you code was *executed* during tests — it says nothing about whether the test actually asserted the right thing, so 100% coverage with weak assertions can still hide real bugs.\n*Follow-up: Is chasing 100% coverage generally a good goal?*\nNot by itself — it's more useful as a tool to spot obviously untested code paths (e.g., an entire error-handling branch with zero coverage) than as a target number to maximize; the last few percent is often trivial boilerplate that isn't worth heavily testing."}, {"id": "H3", "tag": "🔥", "title": "What is CORS, and how is it different from the CSRF problem Django already handles?", "body": "CORS (Cross-Origin Resource Sharing) is a *browser-enforced* rule that blocks JavaScript on one origin (e.g., `app.example.com`) from reading responses from a different origin's API (e.g., `api.example.com`) unless that API explicitly opts in via `Access-Control-Allow-Origin` and related headers. It's a separate concern from CSRF: CSRF is about stopping an attacker's site from *making a request using your credentials*; CORS is about controlling which origins are allowed to *read the response* of a cross-origin request at all. The `django-cors-headers` package adds the relevant headers based on a configured `CORS_ALLOWED_ORIGINS` list.\n*Follow-up: If your API and frontend are on different subdomains, what commonly goes wrong first?*\nThe browser's preflight `OPTIONS` request gets rejected or the actual response is missing the right `Access-Control-Allow-Origin`/`Access-Control-Allow-Credentials` headers, so the frontend's fetch/XHR call fails in the browser console with a CORS error even though hitting the same URL directly (e.g., via Postman, which doesn't enforce CORS) works fine — a very common source of \"it works in Postman but not in the browser\" confusion."}, {"id": "H4", "tag": "⭐", "title": "Beyond a `.env` file, how is production secret management typically handled?", "body": "Dedicated secrets managers — AWS Secrets Manager, HashiCorp Vault, GCP Secret Manager, or a cloud provider's KMS-backed equivalent — store secrets encrypted, provide access-controlled retrieval (often via IAM roles rather than a shared password), support rotation, and give an audit trail of who/what accessed a secret and when, none of which a plain `.env` file on a server gives you.\n*Follow-up: What's a risk of `.env` files even when they're excluded from version control?*\nThey still exist as plaintext files on disk on every server that runs the app — anyone with file-system access to that box (or a backup of it) can read every secret at once, with no audit trail, no per-secret expiry, and no easy way to rotate a single credential without redeploying."}, {"id": "H5", "tag": "🔥", "title": "What does a minimal production setup for containerizing a Django app look like?", "body": "A `Dockerfile` typically installs dependencies, copies the project, runs `collectstatic`, and starts the app under Gunicorn/uWSGI (not `runserver`, which isn't production-grade). A `docker-compose.yml` (for local/staging use) usually defines separate services: the Django app, a Postgres database, Redis (cache/broker), and a Celery worker — each in its own container, sharing a network so they can reach each other by service name.\n*Follow-up: Why run the Celery worker as a separate container/service instead of inside the same container as the web app?*\nThey have different scaling and failure characteristics — you may want more worker replicas than web replicas (or vice versa) under different load, and a crashed/restarting worker shouldn't take down the web process (or vice versa); separate containers/services let you scale and restart them independently."}, {"id": "H6", "tag": "⭐", "title": "Why do production deployments need a health check endpoint, and what should it actually check?", "body": "Load balancers and container orchestrators (Kubernetes, ECS) poll a health check URL to decide whether an instance should keep receiving traffic; a failing check gets that instance pulled out of rotation (or restarted) automatically. A good check goes beyond \"the process is running\" — it should verify the app can actually do its job, e.g., a real (lightweight) database query succeeds and the cache backend responds.\n*Follow-up: What's the risk of a health check that's *too* thorough (e.g., checking every downstream service)?*\nIf the health check itself is slow or depends on a flaky third-party service that's degraded but non-critical, the orchestrator may kill/cycle otherwise-healthy instances unnecessarily — a health check should reflect \"can this instance serve requests,\" not \"are all systems everywhere fully healthy.\""}, {"id": "H7", "tag": "⭐", "title": "Why isn't `print()`/console logging enough in production, and what does a tool like Sentry add?", "body": "Console output on an ephemeral container disappears when the container restarts or gets replaced, and isn't searchable/aggregated across multiple running instances. Structured logging (consistent, parseable fields — timestamp, level, request ID) shipped to a central place, plus an error-tracking tool like Sentry, gives you searchable history, automatic grouping of the same recurring error, stack traces with local variable context, and alerting when new error types appear — none of which scattered `print()` statements provide once you're running more than one server.\n*Follow-up: What's the value of including a \"request ID\" in every log line for a single request?*\nIt lets you filter logs across every layer (view, ORM queries, Celery task triggered by that request) down to exactly the lines belonging to one specific request, which is essential once you have concurrent requests interleaving their log output."}, {"id": "H8", "tag": "⭐", "title": "Why should Django app servers generally be \"stateless,\" and what's the risk of relying on local server state?", "body": "If session data, uploaded files, or in-memory caches live only on one specific app server's disk/memory, then a load balancer routing a user's next request to a *different* server won't see that data — the user appears logged out, or their upload seems to vanish. Keeping state external (sessions and cache in Redis/Memcached, files in S3/object storage, not on local disk) means any server can handle any request, which is what makes horizontal scaling (adding more identical servers) actually work.\n*Follow-up: What is a \"sticky session,\" and why is it considered a workaround rather than a real fix?*\nA sticky session configures the load balancer to always route a given user's requests to the *same* server (usually via a cookie), papering over local-state problems instead of removing them — it still fails if that specific server goes down (the user's \"local\" state is lost) and it can unevenly load specific servers if some users are far more active than others."}, {"id": "H9", "tag": "💡", "title": "How do you invalidate a whole category of cached data immediately (e.g., right after a deploy) instead of waiting for the cache's TTL to expire?", "body": "Bump a version number that's part of the cache key itself (e.g., `cache.get(f\"v{CACHE_VERSION}:product:{id}\")`), stored in a setting or a separate always-fresh cache key you read at request time. Incrementing that version instantly makes every previously cached key \"invisible\" (a cache miss) without deleting anything — old entries simply expire naturally and are never read again.\n*Follow-up: How is this different from just calling `cache.clear()`?*\n`cache.clear()` wipes the *entire* cache backend, which is often shared across unrelated features/keys — an \"everything\" hammer. Key-versioning invalidates only the specific category of data whose version you bumped, leaving unrelated cached data (e.g., session data sharing the same Redis instance) untouched."}, {"id": "H10", "tag": "💡", "title": "What are the common approaches to multi-tenancy in a Django SaaS app, and what's the core tradeoff?", "body": "Three common patterns: **shared database, shared schema** (every table has a `tenant_id`/`organization_id` FK, and every query must filter by it — cheapest to run, but a single missing filter anywhere is a data-leak risk across tenants); **shared database, separate schema per tenant** (Postgres schemas isolate tenants at the DB level while sharing one physical database — better isolation, more operational complexity, e.g. running migrations across every schema); **separate database per tenant** (strongest isolation and easiest per-tenant backup/restore, but the most operational overhead at scale, especially with thousands of tenants).\n*Follow-up: For the shared-schema approach, how do you avoid relying on every single developer remembering to add `.filter(tenant=current_tenant)` everywhere?*\nCentralize it — a custom manager/base QuerySet that automatically scopes to the current tenant (read from thread-local/request-scoped context set by a middleware early in the request), so tenant filtering happens by default rather than depending on it being manually repeated correctly in every view."}]}], "appendix": "## A Note on Honesty About These Tags\n\nOne more thing worth saying plainly: no public source (including me) can hand you a verified list of exactly what your specific upcoming interview will ask — company-specific question banks from Glassdoor/Blind are self-reported, inconsistent, and often stale. The 🔥/⭐/💡 tags on Sections 1–13 reflect *topic-level* consensus across current interview-prep and hiring material (i.e., \"N+1 queries\" and \"URL shortener\" keep showing up independently across many sources), not a guarantee about any one interview. The tags on Sections 14–17 (the gap-fill pass) are my own judgment about how often a thorough 2+ YOE Django loop reaches for each topic, formed from general knowledge of real-world Django backend work rather than a fresh cross-source frequency count — I looked, but didn't find independent frequency signal strong enough to claim the same level of verification for those newer, more advanced/production-facing topics. Either way: treat the tags as **where to spend limited prep time**, not a leaked question paper, and treat \"not tagged 🔥\" as \"still worth knowing,\" not \"safe to skip.\"\n\n## What Changed in the Gap-Fill Pass\n\nSections 1–13 (122 questions) were reviewed against what a Django backend interview can reasonably probe from basics through advanced, for someone a little past 1–2 YOE with strong fundamentals. The original set already covered the ORM (N+1, transactions, migrations, inheritance patterns, custom managers), CBVs/FBVs, auth internals, a solid chunk of DRF, Celery basics, caching, testing basics, Django's built-in security features, and deployment fundamentals — genuinely strong coverage, not a thin list. The gaps that were real and worth closing (now Sections 14–17, 33 new questions):\n\n- **Advanced ORM/DB:** database routers & read replicas, connection pooling, zero-downtime schema changes, data migrations, transaction isolation levels, `.only()`/`.defer()`/`.iterator()`, soft delete.\n- **Advanced DRF & API design:** structured filtering (`django-filter`), the `@action` decorator, API versioning, OpenAPI docs, consistent error handling, JWT refresh/blacklist, object-level permissions (`django-guardian`), custom auth backends.\n- **Async/real-time:** Celery's `chain`/`group`/`chord`, task routing across queues, Django Channels/WebSockets at a conceptual level, testing Celery tasks.\n- **Testing & production readiness:** `pytest-django`, test coverage's limits, CORS (a genuinely large omission from the original set given how often \"it works in Postman but not the browser\" comes up), secrets management, Docker, health checks, logging/Sentry, horizontal scaling/statelessness, cache invalidation strategy, multi-tenancy patterns.\n\nNothing in Sections 1–13 was removed or renumbered, so any progress you've already tracked against those IDs still applies.\n\n## Quick Tips for a 1–2 YOE (and Up) Interview\n\n- Be ready to **write code on a whiteboard/shared doc**: a simple model, a view with `select_related`, or a DRF serializer — interviewers often care more about syntax fluency than deep internals at this level.\n- Know **N+1 queries, `select_related` vs `prefetch_related`, and CSRF** cold — these three come up in almost every Django interview at this level.\n- Be able to explain **one real bug you fixed** involving performance (query optimization) or a security issue (CSRF/XSS) from your own project experience — interviewers love a concrete story over textbook definitions.\n- Brush up on whichever of **Celery, DRF, or caching** you've actually used in your job — don't overclaim depth you don't have; it's fine to say \"I've used it at a basic level for X\" and reason through a follow-up logically.\n- If you're past the 1–2 YOE bar and being screened for a more senior slot, expect at least one question to drift toward **production concerns** — CORS, Docker, deployment, scaling, or observability — even in an otherwise \"junior\" Django loop; Section 17 is built specifically for that."};
